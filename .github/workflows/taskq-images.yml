name: taskq images
# Builds the cryptanalysis taskq worker images (cloud/taskq/Dockerfile.*).
# Pull requests build both to prove the Dockerfiles work; pushes to main also
# publish them to GHCR as :latest and :<sha>, the names values-cryptanalysis.yaml uses.
on:
  workflow_dispatch:
  pull_request:
    paths: ['cloud/taskq/Dockerfile.*', '.github/workflows/taskq-images.yml']
  push:
    branches: [main]
    paths: ['cloud/taskq/Dockerfile.*', '.github/workflows/taskq-images.yml']
# A new commit supersedes runs for this PR or branch; manual runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk for the CUDA devel base
        if: matrix.variant == 'gpu'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: cloud/taskq
          file: cloud/taskq/Dockerfile.${{ matrix.variant }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            TASKQ_IMAGE=ghcr.io/${{ github.repository_owner }}/cryptanalysis-taskq-${{ matrix.variant }}:${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/cryptanalysis-taskq-${{ matrix.variant }}:latest
            ghcr.io/${{ github.repository_owner }}/cryptanalysis-taskq-${{ matrix.variant }}:${{ github.sha }}
