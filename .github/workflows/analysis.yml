name: analysis

# Static analysis, formatting and coverage.  Everything here is a gate: the
# tree is clean under all of it today, so a new finding means new code, not a
# backlog.  Building and testing lives in ci.yml.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # --------------------------------------------------------- clang-tidy ----
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-tidy

      - name: Generate the compilation database
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCA_BUILD_SHARED=OFF

      - name: Run clang-tidy
        # .clang-tidy sets WarningsAsErrors, so a finding fails the step.
        # The two disabled analyzer checks each carry a reason in that file.
        run: clang-tidy -p build --quiet src/*.c tools/*.c tests/*.c

  # ----------------------------------------------------------- cppcheck ----
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,performance,portability,style \
                   --inline-suppr --std=c11 --error-exitcode=1 \
                   --suppress=missingIncludeSystem \
                   -Iinclude -Isrc -Icuda --quiet \
                   src tools tests

  # ------------------------------------------------------- gcc analyzer ----
  gcc-analyzer:
    name: gcc -fanalyzer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build with the analyzer, warnings as errors
        # -fanalyzer is a separate engine from clang-analyzer and catches a
        # different class of ownership bug, so it is worth the build time.
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCA_BUILD_TESTS=OFF -DCA_BUILD_SHARED=OFF \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_C_FLAGS="-fanalyzer -Wall -Wextra -Werror"
          cmake --build build -j"$(getconf _NPROCESSORS_ONLN)"

  # ------------------------------------------------------------- format ----
  format:
    name: clang-format (changed lines)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format

      - name: Check the lines this change touches
        # Only the touched lines, not the whole tree: the sources predate
        # .clang-format and a wholesale reformat would bury every future diff.
        # New and edited code still has to match the style.
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base=$(git rev-parse "HEAD^" 2>/dev/null || git rev-parse HEAD)
          fi
          echo "comparing against $base"
          diff=$(git-clang-format --diff --extensions c,h,cu,cuh "$base" || true)
          case "$diff" in
            ""|*"no modified files to format"*|*"clang-format did not modify any files"*)
              echo "formatting is clean"
              ;;
            *)
              echo "$diff"
              echo "::error::clang-format would change the lines above; run git clang-format"
              exit 1
              ;;
          esac

  # --------------------------------------------------------- shell + yml ----
  lint-scripts:
    name: shellcheck + actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck scripts/*.sh deploy/*/*.sh

      - name: actionlint
        # Also runs shellcheck over every `run:` block in these workflows.
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  # ----------------------------------------------------------- coverage ----
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcovr

      - name: Build instrumented and run the suite
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCA_BUILD_SHARED=OFF \
            -DCMAKE_C_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build -j"$(getconf _NPROCESSORS_ONLN)"
          ctest --test-dir build --output-on-failure

      - name: Report
        # The floors sit a little under the current numbers (91% lines, 92%
        # functions) so ordinary churn does not fail the build, but deleting
        # a test suite does.  gcov miscounts some branches as negative hits
        # (GCC PR 68080); that is a known gcov bug, not a coverage gap.
        run: |
          set -eu
          mkdir -p coverage-html
          gcovr --root . --filter 'src/' --exclude 'src/gpu_cuda_stub.c' \
                --gcov-ignore-parse-errors negative_hits.warn_once_per_file \
                --print-summary \
                --fail-under-line 85 --fail-under-function 88 \
                --html-details coverage-html/index.html \
                --txt coverage.txt \
                build

      - name: Publish the summary
        if: always()
        run: |
          [ -f coverage.txt ] || exit 0
          {
            echo '### Line coverage'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage-html/
          if-no-files-found: warn
          retention-days: 14
