name: n83 portable quotient segment

on:
  pull_request:
    paths:
      - ".github/workflows/n83-portable-quotient-segment.yml"
  workflow_call:
    inputs:
      query_start:
        required: true
        type: string
      query_reps_log2:
        required: true
        type: string
      from_wave:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      query_start:
        description: Aligned R27 query start in the frozen n83 public-target plan
        required: true
        type: string
        default: "1207959552"
      query_reps_log2:
        description: Query representatives per run as a power of two (27 or 29)
        required: true
        type: string
        default: "29"

permissions:
  contents: read

concurrency:
  group: n83-portable-segment-${{ github.ref }}-${{ inputs.query_start || '1207959552' }}-R${{ inputs.query_reps_log2 || '29' }}
  cancel-in-progress: false

jobs:
  physical-x86-segment:
    # One grouped PR measurement was dispatched from this frozen head. Later
    # receipt and documentation commits must not launch a repeat.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.sha == '4a997c30ec6993ed2213fd31615ac9a28ddd7fc9' || (inputs.from_wave && github.event.pull_request.head.repo.full_name == 'aburan28/cryptanalysis' && github.event.pull_request.head.ref == 'codex/koblitz-pair-claw-toy')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SEGMENT_QUERY_START: ${{ inputs.query_start || '1207959552' }}
      SEGMENT_QUERY_REPS_LOG2: ${{ inputs.query_reps_log2 || '29' }}
      SEGMENT_FROM_WAVE: ${{ inputs.from_wave || false }}
    steps:
      - uses: actions/checkout@v4

      - name: Freeze input and host resource preflight
        run: |
          mkdir -p "$RUNNER_TEMP/n83-segment"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, shutil, subprocess
          start = int(os.environ['SEGMENT_QUERY_START'])
          reps_log2 = int(os.environ['SEGMENT_QUERY_REPS_LOG2'])
          r27 = 1 << 27
          r30 = 1 << 30
          assert reps_log2 in (27, 29)
          reps = 1 << reps_log2
          assert r30 <= start < 118 * r30 and start % r27 == 0
          assert start % r30 + reps <= r30
          if os.environ.get('SEGMENT_FROM_WAVE', 'false').lower() == 'true':
              root = pathlib.Path('experiments/koblitz-pair-claw-20260929')
              plan = json.loads((root / 'n83_portable_wave_plan.json').read_text())
              assert plan['status'] == 'ready_after_independent_first_R29_zero_receipt'
              assert plan['first_R29_bundle_sha256']
              assert plan['first_R29_sage_replay_sha256']
              assert start in plan['query_starts'] and reps == plan['query_representatives_per_job']
              for path, field in (
                  (root / 'n83_full_spill_segment_work.json', 'coverage_ledger_sha256'),
                  (pathlib.Path('.github/workflows/n83-portable-quotient-wave.yml'), 'workflow_sha256'),
                  (pathlib.Path('.github/workflows/n83-portable-quotient-segment.yml'), 'segment_workflow_sha256'),
              ):
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == plan[field]
          assert platform.machine().lower() in ('x86_64', 'amd64')
          meminfo = pathlib.Path('/proc/meminfo').read_text().splitlines()
          memory = {line.split(':', 1)[0]: int(line.split(':', 1)[1].split()[0]) * 1024
                    for line in meminfo if ':' in line}
          disk = shutil.disk_usage('/').free
          report = {
              'kind': f'n83_portable_R{reps_log2}_host_preflight',
              'query_start': start,
              'query_representatives': reps,
              'architecture': platform.machine(),
              'platform': platform.platform(),
              'cpu_model': next((line.split(':', 1)[1].strip() for line in
                                 pathlib.Path('/proc/cpuinfo').read_text().splitlines()
                                 if line.startswith('model name')), None),
              'compiler': subprocess.run(['clang++', '--version'],
                                         check=True, capture_output=True,
                                         text=True).stdout.splitlines()[0],
              'mem_total_bytes': memory['MemTotal'],
              'mem_available_bytes': memory['MemAvailable'],
              'root_free_bytes': disk,
              'minimum_mem_available_bytes': 6 << 30,
              'minimum_root_free_bytes': 10 << 30,
          }
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'n83-segment' / 'host.json'
          out.write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          assert memory['MemAvailable'] >= 6 << 30, 'insufficient free memory for M31 Bloom'
          assert disk >= 10 << 30, 'insufficient root free space for M31 run'
          PY

      - name: Same-host bounded exact control
        run: |
          python3 experiments/koblitz-pair-claw-20260929/run_n83_portable_chunk.py \
            --cpu-backend x86_pclmul --cxx clang++ \
            --spill-dir "$RUNNER_TEMP" \
            --binary "$RUNNER_TEMP/n83-segment/ecc2k83-control" \
            --table-log2 20 --query-reps-log2 14 \
            --table-start 0 --query-start "$SEGMENT_QUERY_START" \
            --workers 4 --rep-batch 8 --bits-per-key 20 --hashes 10 \
            --out "$RUNNER_TEMP/n83-segment/control.json"

      - name: Full M31 grouped public-target segment
        run: |
          python3 experiments/koblitz-pair-claw-20260929/run_n83_portable_chunk.py \
            --cpu-backend x86_pclmul --cxx clang++ \
            --spill-dir "$RUNNER_TEMP" \
            --binary "$RUNNER_TEMP/n83-segment/ecc2k83-full" \
            --table-log2 31 --query-reps-log2 "$SEGMENT_QUERY_REPS_LOG2" \
            --table-start 0 --query-start "$SEGMENT_QUERY_START" \
            --workers 4 --rep-batch 8 --bits-per-key 20 --hashes 10 \
            --out "$RUNNER_TEMP/n83-segment/full.json"

      - name: Check terminal receipt
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'n83-segment'
          control = json.loads((root / 'control.json').read_text())
          result = json.loads((root / 'full.json').read_text())
          assert control['curve_id'] == result['curve_id'] == 'EC1N83Ckb1h876c2921cb64'
          assert (control['factor_base']['enumerated_set_sha256'] ==
                  result['factor_base']['enumerated_set_sha256'])
          assert (control['factor_base']['actual_usable_points_B_before_folding'] ==
                  result['factor_base']['actual_usable_points_B_before_folding'])
          assert result['isogeny'] == 'none' and result['candidate_id'] is None
          assert result['public_target'] == control['public_target']
          assert result['table_descriptors'] == 1 << 31
          assert result['query_representatives'] == 1 << int(os.environ['SEGMENT_QUERY_REPS_LOG2'])
          assert result['query_start'] == int(os.environ['SEGMENT_QUERY_START'])
          assert result['native_result']['candidate_store_mode'] == 'unlinked_file'
          assert result['native_result']['peak_rss_bytes'] >= result['native_result']['bloom_bytes']
          if result['native_result']['exact_hit_queries']:
              assert result['verified_public_target_quotient_table_dlp'], 'exact hit needs review'
          print(json.dumps({'exact_hit_queries': result['native_result']['exact_hit_queries'],
                            'verified_dlp': result['verified_public_target_quotient_table_dlp'],
                            'target_online_seconds': result['target_online_seconds']}))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n83-portable-R${{ inputs.query_reps_log2 || '29' }}-start-${{ inputs.query_start || '1207959552' }}
          path: ${{ runner.temp }}/n83-segment/*.json
          if-no-files-found: warn
