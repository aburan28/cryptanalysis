name: Section 23 single-target round against the tuned rho (Tier 1)

# One fresh GitHub-hosted ubuntu-24.04 runner is the Tier 1 instance. The
# frozen protocol is experiments/koblitz-s23-tuned-rho-20261015/protocol.json:
# ledger section 23's round (six sizes, 64 public points each, IC programme
# baseline v3's `ic price --single-target` with its in-process ParallelRho)
# with three external strong-rho arms on the same points (default StrongRhoG on
# the one-word and two-word field kernels, and the tuned rT770 configuration),
# one pinned process at a time. verify_receipt.py audits the receipt and
# applies the frozen statistics; nothing here promotes a result.
on:
  push:
    branches: [claude/ic-s23-tuned-rho]
    paths:
      - experiments/koblitz-s23-tuned-rho-20261015/**
      - .github/workflows/s23-tuned-rho.yml
      - '!experiments/koblitz-s23-tuned-rho-20261015/run_github_*/**'
      - '!experiments/koblitz-s23-tuned-rho-20261015/README.md'
      - '!experiments/koblitz-s23-tuned-rho-20261015/README.pdf'
      - '!experiments/koblitz-s23-tuned-rho-20261015/figures/**'
      - '!experiments/koblitz-s23-tuned-rho-20261015/smoke/**'
      - '!experiments/koblitz-s23-tuned-rho-20261015/result*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s23-tuned-rho-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPERIMENT: experiments/koblitz-s23-tuned-rho-20261015
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: never

jobs:
  s23-tuned-rho:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Freeze runner and source identity
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/s23-tuned-rho"
          mkdir -p "$receipt_dir"
          {
            echo "S23_JOB_START=$(date +%s)"
            echo "S23_RECEIPT_DIR=$receipt_dir"
            echo "S23_CRYPTO_REPO=$RUNNER_TEMP/s23-crypto"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/s23-cargo"
          } >> "$GITHUB_ENV"
          python3 scripts/isolated_bench.py probe-host > "$receipt_dir/host-probe.json"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              'provider': 'github_actions',
              'instance_id': 'gh-{}-{}-{}'.format(os.environ['GITHUB_RUN_ID'],
                                                  os.environ['GITHUB_RUN_ATTEMPT'],
                                                  os.environ['GITHUB_JOB']),
              'runner_name': os.environ.get('RUNNER_NAME'),
              'image_os': os.environ.get('ImageOS'),
              'image_version': os.environ.get('ImageVersion'),
              'advertised_runner': 'ubuntu-24.04 standard (4 vCPU, 16 GB)',
              'observed_cpu_affinity': sorted(os.sched_getaffinity(0)),
              'observed_cpu_model': next((line.split(':', 1)[1].strip() for line in
                  Path('/proc/cpuinfo').read_text().splitlines()
                  if line.startswith('model name')), None),
              'observed_mem_total_kib': next((line.split()[1] for line in
                  Path('/proc/meminfo').read_text().splitlines()
                  if line.startswith('MemTotal:')), None),
              'git_sha': os.environ['GITHUB_SHA'],
              'git_ref': os.environ['GITHUB_REF'],
              'run_url': '{}/{}/actions/runs/{}'.format(os.environ['GITHUB_SERVER_URL'],
                  os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_RUN_ID']),
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          path = Path(os.environ['RUNNER_TEMP']) / 's23-tuned-rho' / 'allocation.json'
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

      - name: Restore the pinned crypto sources and the harness, and check every digest
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/aburan28/crypto.git "$S23_CRYPTO_REPO"
          python3 "$EXPERIMENT/restore_sources.py" --crypto-repo "$S23_CRYPTO_REPO" | tee "$S23_RECEIPT_DIR/restore.json"
          sha256sum "$EXPERIMENT/protocol.json" "$EXPERIMENT/inputs/targets.json" | tee "$S23_RECEIPT_DIR/frozen.sha256"

      - name: Install the pinned toolchain and build both crates
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc --version | tee "$S23_RECEIPT_DIR/rustc.txt"
          for crate in v3 r770; do
            (cd "$EXPERIMENT/crates/$crate" && cargo build --release --locked)
          done
          sha256sum "$CARGO_TARGET_DIR"/release/{ic_v3,rho_s23_r770} | tee "$S23_RECEIPT_DIR/binaries.sha256"

      - name: Run the frozen schedule on one pinned CPU
        shell: bash
        run: |
          set +e
          cpu_id="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          python3 "$EXPERIMENT/run_schedule.py" --ic "$CARGO_TARGET_DIR/release/ic_v3" \
            --rho "$CARGO_TARGET_DIR/release/rho_s23_r770" --crypto-repo "$S23_CRYPTO_REPO" \
            --receipt-dir "$S23_RECEIPT_DIR/panel" --cpu "$cpu_id" \
            --job-start-epoch "$S23_JOB_START" --deadline-min 330 > "$S23_RECEIPT_DIR/runner-stdout.jsonl"
          echo "schedule_exit=$?" | tee "$S23_RECEIPT_DIR/schedule-exit.txt"
          echo "S23_CPU=$cpu_id" >> "$GITHUB_ENV"

      - name: Assemble and check section 23's claims (its claims.py, unchanged but for two labels)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          S23_ISOLATION_LABEL="cryptanalysis scripts/isolated_bench.py Tier 1 noise gate; one pinned CPU on a GitHub-hosted ubuntu-24.04 runner; contended attempts re-run up to twice" \
          S23_CPUS="${S23_CPU:-0}" IC_RUNS="$S23_RECEIPT_DIR/panel/runs" IC_OUT="$S23_RECEIPT_DIR/panel/claims_s23" \
            python3 "$S23_CRYPTO_REPO/research/ic_single_target_20260930/claims.py" | tee "$S23_RECEIPT_DIR/claims-stdout.txt"

      - name: Audit the receipt and apply the frozen statistics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 "$EXPERIMENT/verify_receipt.py" --receipt-dir "$S23_RECEIPT_DIR/panel" \
            --crypto-repo "$S23_CRYPTO_REPO" | tee "$S23_RECEIPT_DIR/verify-stdout.json"
          cat "$S23_RECEIPT_DIR/panel/result_table.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve allocation, builds, raw runs, claims and the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s23-tuned-rho-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/s23-tuned-rho/
          if-no-files-found: error
          retention-days: 30
