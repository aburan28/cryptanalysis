name: Ordered independent certificate
on:
  pull_request:
    paths:
      - 'experiments/groebner-perf-20260924/round15/**'
      - 'experiments/groebner-perf-20260924/round14/**'
      - 'experiments/groebner-perf-20260924/round4/**'
      - 'experiments/pdp-scaling/**'
      - '.github/workflows/ordered-certificate.yml'
  push:
    paths:
      - 'experiments/groebner-perf-20260924/round15/**'
      - 'experiments/groebner-perf-20260924/round14/**'
      - 'experiments/groebner-perf-20260924/round4/**'
      - 'experiments/pdp-scaling/**'
      - '.github/workflows/ordered-certificate.yml'
permissions:
  contents: read
concurrency:
  group: ordered-certificate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  certificate:
    name: Ordered certificate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cxx: g++}
          - {os: macos-latest, cxx: clang++}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build independent decoder variants and unchanged producer
        run: |
          python experiments/groebner-perf-20260924/round4/build.py
          python experiments/groebner-perf-20260924/round14/build.py
          python experiments/groebner-perf-20260924/round15/build.py
      - name: Exact certificates, malformed inputs, concurrency and replay
        run: python -m unittest discover -s experiments/groebner-perf-20260924/round15 -p 'test_*.py' -v
      - name: Audit complete-query evidence
        run: python experiments/groebner-perf-20260924/round15/verify_evidence.py
