name: ECC2K-130 root policy
on:
  pull_request:
    paths:
      - 'ecc2k130/runner/include/collective_inverse.cuh'
      - 'ecc2k130/runner/include/collective_root_policy.h'
      - 'ecc2k130/runner/research/table-walk-small-blocks-20261005/**'
      - '.github/workflows/ecc2k130-root-policy.yml'
  push:
    paths:
      - 'ecc2k130/runner/include/collective_inverse.cuh'
      - 'ecc2k130/runner/include/collective_root_policy.h'
      - 'ecc2k130/runner/research/table-walk-small-blocks-20261005/**'
      - '.github/workflows/ecc2k130-root-policy.yml'
permissions:
  contents: read
jobs:
  portable-root-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 ecc2k130/runner/research/table-walk-small-blocks-20261005/check_root_model.py
