name: Prepared field witness checking

on:
  pull_request:
    paths:
      - 'experiments/groebner-perf-20260924/**'
      - 'experiments/pdp-scaling/**'
      - '.github/workflows/packed-field-checker.yml'
  push:
    paths:
      - 'experiments/groebner-perf-20260924/**'
      - 'experiments/pdp-scaling/**'
      - '.github/workflows/packed-field-checker.yml'

permissions:
  contents: read

concurrency:
  group: packed-field-checker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness-and-timing:
    name: Prepared field witness checking (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild, preflight, measure and independently audit the frozen panel
        run: python -u experiments/groebner-perf-20260924/round64/run_validation.py --output packed-field-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packed-field-checker-${{ matrix.os }}
          path: packed-field-evidence/
          if-no-files-found: error
          retention-days: 14
