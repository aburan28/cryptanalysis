name: fb-archive-offsite

# Permanent offsite copy of the factor-base archive (experiments/fb-archive).
# Uploads every archived base, the index, alias and debt lists, the sweep recipes,
# and the materialized point shards of every sweep (sweep_points.py), to
# $IC_ARCHIVE_S3_URI. The bucket is meant to have versioning and Object Lock in
# compliance mode, so nothing uploaded can be deleted or overwritten (see
# experiments/fb-archive/README.md, "Keeping the archive forever").
#
# Each shard is regenerated here and must match the content SHA-256 committed in
# sweeps/<name>.points.csv before it is uploaded; objects already present with
# that digest are skipped, so the weekly run is cheap and re-checks the bucket.
# Without the secrets every job is skipped and says so.
on:
  push:
    branches: ["claude/cryptanalysis-repo-setup-p59kek"]
    paths:
      - "experiments/fb-archive/**"
      - ".github/workflows/fb-archive-offsite.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fb-archive-offsite
  cancel-in-progress: false

env:
  IC_ARCHIVE_S3_URI: ${{ secrets.IC_ARCHIVE_S3_URI }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

jobs:
  archive:
    name: upload archived bases and recipes
    runs-on: ubuntu-latest
    # archives over 1 MiB are not in git; --rebuild-missing regenerates them (largest: n = 47, 8.4M points)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify
        working-directory: experiments/fb-archive
        run: python fbarchive.py verify
      - name: Upload
        if: env.IC_ARCHIVE_S3_URI != '' && env.AWS_ACCESS_KEY_ID != ''
        working-directory: experiments/fb-archive
        run: |
          python -m pip install --quiet boto3
          python fbarchive.py upload --require --rebuild-missing
      - name: Report a skipped upload
        if: env.IC_ARCHIVE_S3_URI == '' || env.AWS_ACCESS_KEY_ID == ''
        run: echo "IC_ARCHIVE_S3_URI or AWS credentials are not configured; nothing was copied offsite." >> "$GITHUB_STEP_SUMMARY"

  sweep-points:
    name: sweep points ${{ matrix.sweep }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sweep: [volcano-ic, volcano-m83, ecc2k130-isogeny-class]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate, check digests, upload
        if: env.IC_ARCHIVE_S3_URI != '' && env.AWS_ACCESS_KEY_ID != ''
        working-directory: experiments/fb-archive
        run: |
          python -m pip install --quiet boto3
          python sweep_points.py points ${{ matrix.sweep }} --check --upload --workers "$(nproc)"
      - name: Report a skipped upload
        if: env.IC_ARCHIVE_S3_URI == '' || env.AWS_ACCESS_KEY_ID == ''
        run: echo "IC_ARCHIVE_S3_URI or AWS credentials are not configured; ${{ matrix.sweep }} points were not copied offsite." >> "$GITHUB_STEP_SUMMARY"
