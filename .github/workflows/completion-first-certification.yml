name: Completion-first algebraic certification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and verify scheduled independent certification
        env:
          CXX: clang++
        run: python experiments/groebner-perf-20260924/round93/run_validation.py --output completion-first-evidence
      - name: Retain successes and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: completion-first-${{ matrix.os }}
          path: completion-first-evidence
          if-no-files-found: error
