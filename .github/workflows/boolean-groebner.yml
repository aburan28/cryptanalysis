name: Boolean Groebner certificates
on:
  pull_request:
    paths:
      - 'experiments/pdp-scaling/**'
      - 'experiments/groebner-perf-20260924/**'
      - '.github/workflows/boolean-groebner.yml'
  push:
    paths:
      - 'experiments/pdp-scaling/**'
      - 'experiments/groebner-perf-20260924/**'
      - '.github/workflows/boolean-groebner.yml'
permissions:
  contents: read
concurrency:
  group: boolean-groebner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  certificate:
    name: Exact certificates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cxx: g++}
          - {os: macos-latest, cxx: clang++}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install sympy
      - name: Unpack byte-preserved measurement evidence
        run: python experiments/groebner-perf-20260924/unpack_evidence.py
      - name: Build verifier and solver, including UBSan
        run: python experiments/groebner-perf-20260924/build_portable.py
      - name: Verify shipped evidence hashes
        run: python experiments/groebner-perf-20260924/verify_archive.py
      - name: Differential certificates and solver integration
        run: python experiments/groebner-perf-20260924/ci_check.py
      - name: Python certificate and Boolean completion regressions
        working-directory: experiments/pdp-scaling
        run: python -m unittest test_boolean_basis test_boolean_f5b test_macaulay_cache
  m4ri:
    name: Boolean native and M4RI replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install M4RI
        run: |
          sudo apt-get update
          sudo apt-get install -y libm4ri-dev pkg-config
          mkdir -p "$RUNNER_TEMP/m4ri"
          ln -s /usr/include "$RUNNER_TEMP/m4ri/include"
          ln -s "/usr/lib/$(gcc -print-multiarch)" "$RUNNER_TEMP/m4ri/lib"
          echo "M4RI_PREFIX=$RUNNER_TEMP/m4ri" >> "$GITHUB_ENV"
      - name: Native basis, implicit field pairs, and original curve replay
        working-directory: experiments/pdp-scaling
        run: python -m unittest test_boolean_native_runner
