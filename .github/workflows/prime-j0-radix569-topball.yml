name: prime-j0-radix569-topball

on:
  pull_request:
    paths:
      - ".github/workflows/prime-j0-radix569-topball.yml"
      - "experiments/prime-j0-radix569-topball-20261012/**"
      - "experiments/prime-j0-secp256k1-native/**"
      - "experiments/prime-j0-pareto-tree-20261012/plans.bin"
      - "experiments/prime-j0-sector-digit-20261010/fresh-inputs.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Lean coverage and top-sector proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install elan for pinned Lean
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit all theorem modules
        run: python3 experiments/prime-j0-radix569-topball-20261012/check.py --check

  exact_replay:
    name: Exact tables and independent 512-point replay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct the finite radix and table certificates
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-radix569-topball-20261012/radix_search.py --check
          python3 experiments/prime-j0-radix569-topball-20261012/topball.py --check
          python3 experiments/prime-j0-radix569-topball-20261012/screen.py --check
      - name: Replay disjoint holdout public points
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-radix569-topball-20261012/holdout.py --check
          python3 experiments/prime-j0-radix569-topball-20261012/holdout_replay.py --check

  native:
    name: Locked Rust build and native 512-point replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/radix569-native-target
    steps:
      - uses: actions/checkout@v4
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path experiments/prime-j0-secp256k1-native/Cargo.toml
      - name: Build disposable native evaluator
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-radix569-topball-20261012/native_overlay.py \
            "$RUNNER_TEMP/radix569-native-overlay" --build
      - name: Audit native atlases and public points
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-radix569-topball-20261012/native_replay.py \
            --binary "$CARGO_TARGET_DIR/release/eisenstein_fixed" \
            --overlay-record "$RUNNER_TEMP/radix569-native-overlay/overlay.json" --check
