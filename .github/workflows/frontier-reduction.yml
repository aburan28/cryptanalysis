name: Cached leading terms and reduction experiments
on:
  pull_request:
    paths:
      - 'experiments/groebner-perf-20260924/round13/**'
      - 'experiments/groebner-perf-20260924/round12/**'
      - 'experiments/groebner-perf-20260924/round11/**'
      - 'experiments/groebner-perf-20260924/round5/**'
      - 'experiments/groebner-perf-20260924/measured_source.py'
      - 'experiments/groebner-perf-20260924/measured_sources/**'
      - 'experiments/groebner-perf-20260924/test_measured_source.py'
      - '.github/workflows/frontier-reduction.yml'
  push:
    paths:
      - 'experiments/groebner-perf-20260924/round13/**'
      - 'experiments/groebner-perf-20260924/round12/**'
      - 'experiments/groebner-perf-20260924/round11/**'
      - 'experiments/groebner-perf-20260924/round5/**'
      - 'experiments/groebner-perf-20260924/measured_source.py'
      - 'experiments/groebner-perf-20260924/measured_sources/**'
      - 'experiments/groebner-perf-20260924/test_measured_source.py'
      - '.github/workflows/frontier-reduction.yml'
permissions:
  contents: read
concurrency:
  group: frontier-reduction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    name: Cached reduction traces (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cxx: g++}
          - {os: macos-latest, cxx: clang++}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build original, ablations, caches and UBSan trap variants
        run: python experiments/groebner-perf-20260924/round13/build.py
      - name: Exact trace, independent oracle and boundary checks
        run: python -m unittest discover -s experiments/groebner-perf-20260924/round13 -p 'test_*.py' -v
      - name: Historical source integrity checks
        run: python experiments/groebner-perf-20260924/test_measured_source.py
      - name: Audit frozen paired measurements
        run: python experiments/groebner-perf-20260924/round13/verify_evidence.py
