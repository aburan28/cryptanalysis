name: Sparse F4 column query timing

on:
  pull_request:
    paths:
      - 'experiments/groebner-perf-20260924/**'
      - 'experiments/pdp-scaling/**'
      - '.github/workflows/sparse-f4-column-timing.yml'
  push:
    paths:
      - 'experiments/groebner-perf-20260924/**'
      - 'experiments/pdp-scaling/**'
      - '.github/workflows/sparse-f4-column-timing.yml'

permissions:
  contents: read

concurrency:
  group: sparse-f4-column-timing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness-and-timing:
    name: Sparse F4 column query (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild, preflight, measure and independently audit the frozen panel
        run: python -u experiments/groebner-perf-20260924/round59/run_validation.py --output column-timing-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sparse-f4-column-timing-${{ matrix.os }}
          path: column-timing-evidence/
          if-no-files-found: error
          retention-days: 14
