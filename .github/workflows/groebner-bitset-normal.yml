name: Groebner certified F4 bounded bitset
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  exact:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CXX: clang++
      GROEBNER_PHASE_REFERENCE_ROOT: ${{ github.workspace }}
      GROEBNER_F4_REFERENCE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and independently audit the frozen reference
        run: python experiments/groebner-perf-20260924/round112/run_validation.py --output f4-bitset-evidence/reference
      - name: Build scratch and bitset native engines
        run: |
          python experiments/groebner-perf-20260924/round118/build.py --reference-root "$GITHUB_WORKSPACE"
          python experiments/groebner-perf-20260924/round119/build.py --reference-root "$GITHUB_WORKSPACE"
      - name: Check exact proofs and paired complete queries
        run: |
          python experiments/groebner-perf-20260924/round118/panel.py --reference-report f4-bitset-evidence/reference/panel/report.json --output f4-bitset-evidence/scratch
          python experiments/groebner-perf-20260924/round119/panel.py --reference-report f4-bitset-evidence/reference/panel/report.json --output f4-bitset-evidence/bitset
          python experiments/groebner-perf-20260924/round119/test_large.py --output f4-bitset-evidence/large-proof.json
          python experiments/groebner-perf-20260924/round119/profile.py --reference-root "$GITHUB_WORKSPACE" --reference-report f4-bitset-evidence/reference/panel/report.json --output f4-bitset-evidence/paired --reps 3
      - name: Freeze and smoke the isolated complete-query manifest
        run: |
          python experiments/groebner-perf-20260924/round120/make_isolated_manifest.py --reference-root "$GITHUB_WORKSPACE" --validation-root f4-bitset-evidence/reference --scratch-panel f4-bitset-evidence/scratch --bitset-panel f4-bitset-evidence/bitset --python "$(python -c 'import sys; print(sys.executable)')" --cgroup /sys/fs/cgroup/benchmark-isolated --cpus 4-5 --execution-cpu 4 --mem-nodes 0 --output "$GITHUB_WORKSPACE/f4-bitset-evidence/isolated-manifest.json"
          python experiments/groebner-perf-20260924/round120/test_manifest.py --manifest "$GITHUB_WORKSPACE/f4-bitset-evidence/isolated-manifest.json" --output "$GITHUB_WORKSPACE/f4-bitset-evidence/isolated-worker-smoke.json"
      - name: Retain exact results and failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groebner-bitset-${{ matrix.os }}
          path: f4-bitset-evidence
          if-no-files-found: error
