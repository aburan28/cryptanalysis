name: Fixed-width affine-proof elimination

on:
  pull_request:
    paths:
      - 'experiments/groebner-perf-20260924/round37/**'
      - 'experiments/groebner-perf-20260924/round36/**'
      - 'experiments/groebner-perf-20260924/round35/**'
      - 'experiments/groebner-perf-20260924/round34/**'
      - 'experiments/groebner-perf-20260924/round33/**'
      - 'experiments/groebner-perf-20260924/round32/**'
      - 'experiments/groebner-perf-20260924/round31/**'
      - 'experiments/groebner-perf-20260924/round27/**'
      - 'experiments/groebner-perf-20260924/round23/**'
      - 'experiments/groebner-perf-20260924/round20/**'
      - 'experiments/groebner-perf-20260924/round18/**'
      - 'experiments/groebner-perf-20260924/round17/**'
      - 'experiments/groebner-perf-20260924/round15/**'
      - 'experiments/groebner-perf-20260924/round14/**'
      - 'experiments/groebner-perf-20260924/round4/**'
      - 'experiments/groebner-perf-20260924/round2/**'
      - 'experiments/pdp-scaling/**'
      - 'experiments/pdp-degree-heuristics/**'
      - '.github/workflows/fixed-width-affine-proof.yml'
  push:
    paths:
      - 'experiments/groebner-perf-20260924/round37/**'
      - 'experiments/groebner-perf-20260924/round36/**'
      - 'experiments/groebner-perf-20260924/round35/**'
      - 'experiments/groebner-perf-20260924/round34/**'
      - 'experiments/groebner-perf-20260924/round33/**'
      - 'experiments/groebner-perf-20260924/round32/**'
      - 'experiments/groebner-perf-20260924/round31/**'
      - '.github/workflows/fixed-width-affine-proof.yml'

permissions:
  contents: read

concurrency:
  group: fixed-width-affine-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    name: Fixed-width affine proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install numpy==2.4.0
      - name: Build independent CPU dependencies
        run: |
          mkdir -p fixed-width-evidence
          python experiments/groebner-perf-20260924/round20/build.py > fixed-width-evidence/dependency-build.log 2>&1
          python experiments/groebner-perf-20260924/round23/build.py > fixed-width-evidence/checker-build.log 2>&1
      - name: Build portable producer
        if: runner.os == 'Linux'
        run: |
          python experiments/groebner-perf-20260924/round31/build.py > fixed-width-evidence/baseline-build.log 2>&1
          python experiments/groebner-perf-20260924/round32/build.py > fixed-width-evidence/certified-build.log 2>&1
          python experiments/groebner-perf-20260924/round33/build.py > fixed-width-evidence/narrow-build.log 2>&1
          python experiments/groebner-perf-20260924/round34/build.py > fixed-width-evidence/multiplier-build.log 2>&1
          python experiments/groebner-perf-20260924/round35/build.py > fixed-width-evidence/symmetry-build.log 2>&1
          python experiments/groebner-perf-20260924/round36/build.py > fixed-width-evidence/deferred-build.log 2>&1
          python experiments/groebner-perf-20260924/round37/build.py > fixed-width-evidence/producer-build.log 2>&1
      - name: Build requested Metal producer
        if: runner.os == 'macOS'
        run: |
          python experiments/groebner-perf-20260924/round31/build.py --metal > fixed-width-evidence/baseline-build.log 2>&1
          python experiments/groebner-perf-20260924/round32/build.py --metal > fixed-width-evidence/certified-build.log 2>&1
          python experiments/groebner-perf-20260924/round33/build.py --metal > fixed-width-evidence/narrow-build.log 2>&1
          python experiments/groebner-perf-20260924/round34/build.py --metal > fixed-width-evidence/multiplier-build.log 2>&1
          python experiments/groebner-perf-20260924/round35/build.py --metal > fixed-width-evidence/symmetry-build.log 2>&1
          python experiments/groebner-perf-20260924/round36/build.py --metal > fixed-width-evidence/deferred-build.log 2>&1
          python experiments/groebner-perf-20260924/round37/build.py --metal > fixed-width-evidence/producer-build.log 2>&1
          echo "QUADRATIC_TEST_METAL=1" >> "$GITHUB_ENV"
      - name: Exact queries, exhaustive functions, sanitizer and corruption controls
        run: python -m unittest discover -s experiments/groebner-perf-20260924/round37 -p 'test_*.py' -v > fixed-width-evidence/tests.log 2>&1
      - name: Check the deferred-proof research hypothesis
        run: python experiments/groebner-perf-20260924/round35/research/deferred_proof_pilot.py --output fixed-width-evidence/deferred-proof-pilot.json
      - name: Retain source-bound complete-query correctness evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path('experiments/groebner-perf-20260924/round37')
          out = pathlib.Path('fixed-width-evidence')
          metadata = {k: os.environ.get(k) for k in ('GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_OS', 'RUNNER_ARCH')}
          (out/'runner.json').write_text(json.dumps(metadata, indent=2)+'\n')
          command = [sys.executable, str(root/'measure_fixed_width.py'), '--correctness-only', '--repetitions', '2', '--output', str(out/'correctness.json.gz')]
          if sys.platform == 'darwin':
              command.append('--metal')
          for name, flags in (('correctness', []), ('wide-correctness', ['--large-controls'])):
              command[command.index('--output')+1] = str(out/(name+'.json.gz'))
              subprocess.run(command+flags, check=True)
          # Import the trusted auditor once. Its offline exact-input caches
          # are reused across evidence bundles; timed queries never use them.
          sys.path.insert(0, str(root.resolve()))
          from audit_fixed_width import audit
          reports = [(out/(name+'.json.gz'), out/(name+'-audit.json'))
                     for name in ('correctness', 'wide-correctness')]
          reports += [(report, out/('retained-'+report.name+'.audit.json'))
                      for report in sorted((root/'results').glob('*.json.gz'))
                      if not report.name.endswith('.journal.gz')]
          for report, summary in reports:
              summary.write_text(json.dumps(audit(report), indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-width-affine-proof-${{ matrix.os }}
          path: fixed-width-evidence/
          if-no-files-found: error
          retention-days: 14
