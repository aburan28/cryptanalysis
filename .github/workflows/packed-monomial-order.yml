name: Packed monomial order
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and verify packed monomial sorting
        env:
          CXX: clang++
        run: python experiments/groebner-perf-20260924/round98/run_validation.py --output packed-monomial-order-evidence
      - name: Retain successes and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-monomial-order-${{ matrix.os }}
          path: packed-monomial-order-evidence
          if-no-files-found: error
