name: prime-j0-radix943-corner-certificate

on:
  pull_request:
    paths:
      - ".github/workflows/prime-j0-radix943-corner-certificate.yml"
      - "experiments/prime-j0-radix943-corner-certificate-20261012/**"
      - "experiments/prime-j0-radix943-digit-cover-20261012/**"
      - "experiments/prime-j0-radix943-termination-20261012/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Pinned Lean reciprocal-corner certificate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install elan for pinned Lean
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit every reported theorem
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-radix943-corner-certificate-20261012/check.py --check
