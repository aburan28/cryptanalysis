name: prime-j0-axis152-xyzz

on:
  pull_request:
    paths:
      - ".github/workflows/prime-j0-axis152-xyzz.yml"
      - "experiments/prime-j0-axis152-xyzz-20261012/**"
      - "experiments/prime-j0-axis152-20261012/**"
      - "experiments/prime-j0-secp256k1-native/**"
      - "suite/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/prime-j0-axis152-xyzz.yml"
      - "experiments/prime-j0-axis152-xyzz-20261012/**"
      - "experiments/prime-j0-axis152-20261012/**"
      - "experiments/prime-j0-secp256k1-native/**"
      - "suite/**"
  workflow_dispatch:

jobs:
  replay:
    name: Locked Rust differential public-point replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check independent scalar panel
        run: python3 experiments/prime-j0-axis152-xyzz-20261012/holdout.py --check
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path experiments/prime-j0-secp256k1-native/Cargo.toml
      - name: Build merged Jacobian reference
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/axis152-ref-target"
          python3 experiments/prime-j0-axis152-20261012/native_overlay.py \
            "$RUNNER_TEMP/axis152-ref-overlay" --build
      - name: Build opt-in XYZZ candidate
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/axis152-xyzz-target"
          python3 experiments/prime-j0-axis152-xyzz-20261012/native_overlay_xyzz.py \
            "$RUNNER_TEMP/axis152-xyzz-overlay" --build
      - name: Compare both independent public-point panels
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-axis152-xyzz-20261012/replay.py \
            --reference "$RUNNER_TEMP/axis152-ref-target/release/eisenstein_fixed" \
            --candidate "$RUNNER_TEMP/axis152-xyzz-target/release/eisenstein_fixed" \
            --reference-record "$RUNNER_TEMP/axis152-ref-overlay/overlay.json" \
            --candidate-record "$RUNNER_TEMP/axis152-xyzz-overlay/overlay.json" \
            --check
