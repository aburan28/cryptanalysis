name: Grouped independent Boolean identities

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/ci/**"
      - ".github/actions/ci-scope/**"
      - "scripts/ci_scope.py"
      - 'experiments/groebner-perf-20260924/**'
      - 'experiments/pdp-scaling/**'
      - 'experiments/pdp-degree-heuristics/**'
      - '.github/workflows/grouped-independent-checker.yml'
  push:
    branches: ["claude/cryptanalysis-repo-setup-p59kek"]
    paths:
      - ".github/ci/**"
      - ".github/actions/ci-scope/**"
      - "scripts/ci_scope.py"
      - 'experiments/groebner-perf-20260924/**'
      - 'experiments/pdp-scaling/**'
      - 'experiments/pdp-degree-heuristics/**'
      - '.github/workflows/grouped-independent-checker.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.scope.outputs.selected }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/ci-scope/
            /.github/ci/
            /scripts/ci_scope.py
      - id: scope
        uses: ./.github/actions/ci-scope
        with:
          workflow: grouped-independent-checker.yml

  correctness:
    needs: changes
    if: ${{ !cancelled() }}
    name: Grouped independent checker (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 25 || 90 }}
    steps:
      - uses: actions/checkout@v7
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        run: python -m pip install numpy==2.4.0
      - name: Build portable dependencies and selected backend
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        shell: bash
        run: |
          mkdir -p grouped-checker-evidence
          for version in 20 23 31 32 33 34 35 36 37 38; do
            python "experiments/groebner-perf-20260924/round${version}/build.py" > "grouped-checker-evidence/build-${version}.log" 2>&1
          done
          flags=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            flags+=(--metal)
          fi
          for version in 44; do
            python "experiments/groebner-perf-20260924/round${version}/build.py" "${flags[@]}" > "grouped-checker-evidence/build-${version}.log" 2>&1
          done
          python experiments/groebner-perf-20260924/round45/build.py > grouped-checker-evidence/build-45.log 2>&1
          python experiments/groebner-perf-20260924/round47/build.py > grouped-checker-evidence/build-47.log 2>&1
          python experiments/groebner-perf-20260924/round48/build.py > grouped-checker-evidence/build-48.log 2>&1
      - name: Detect actual Metal availability
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        shell: bash
        run: |
          cd experiments/groebner-perf-20260924/round44
          if [[ "$RUNNER_OS" == macOS ]]; then
            # Hosted Metal availability is explicit; compilation alone is not a device pass.
            python - <<'PY'
          import os
          from normalized import Producer
          try:
              with Producer(2, 3, 3, backend='metal') as probe:
                  print('METAL_AVAILABLE', probe.device)
          except ValueError as error:
              if str(error) != 'requested Metal device unavailable':
                  raise
              print('METAL_UNAVAILABLE', error)
          else:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('QUADRATIC_TEST_METAL=1\n')
          PY
          fi
      - name: Exercise proof semantics and charged failure boundaries
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        working-directory: experiments/groebner-perf-20260924/round48
        run: |
          python -u run_tests.py > ../../../grouped-checker-evidence/transform-unit-tests.log 2>&1
          python -u run_identity_tests.py > ../../../grouped-checker-evidence/identity-unit-tests.log 2>&1
      - name: Compare every multiplier coefficient with an independent oracle
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        run: python -u experiments/groebner-perf-20260924/round48/validate_identity.py --output grouped-checker-evidence/native-coefficients.json > grouped-checker-evidence/native-coefficients.log 2>&1
      - name: Validate frozen systems and complete-query ablation
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        shell: bash
        run: |
          flags=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            flags+=(--metal)
          fi
          python -u experiments/groebner-perf-20260924/round48/validate_native.py "${flags[@]}" --output grouped-checker-evidence/correctness.json.gz > grouped-checker-evidence/validation.log 2>&1
      - name: Independently audit complete proofs from original equations
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        run: python -u experiments/groebner-perf-20260924/round48/audit_queries.py --input grouped-checker-evidence/correctness.json.gz --output grouped-checker-evidence/independent-audit.json > grouped-checker-evidence/independent-audit.log 2>&1
      - name: Retain actual native binaries and runner identity
        if: ${{ (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false')) && (!cancelled()) }}
        run: |
          python - <<'PY'
          import json, os, pathlib, platform, shutil
          out = pathlib.Path('grouped-checker-evidence')
          out.mkdir(exist_ok=True)
          metadata = {k: os.environ.get(k) for k in ('GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_OS', 'RUNNER_ARCH')}
          metadata.update(platform=platform.platform(), architecture=platform.machine())
          (out / 'runner.json').write_text(json.dumps(metadata, indent=2)+'\n')
          for build in pathlib.Path('experiments/groebner-perf-20260924').glob('round*/build'):
              shutil.copytree(build, out / 'native' / build.parent.name, dirs_exist_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false')) && (!cancelled()) }}
        with:
          name: grouped-checker-${{ matrix.os }}
          path: grouped-checker-evidence/
          if-no-files-found: error
          retention-days: 14
