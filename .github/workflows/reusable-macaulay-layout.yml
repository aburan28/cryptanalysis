name: Reusable Macaulay layouts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build and verify complete algebra queries
        env:
          CXX: clang++
        run: python experiments/groebner-perf-20260924/round92/run_validation.py --output macaulay-layout-evidence
      - name: Retain successes and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macaulay-layout-${{ matrix.os }}
          path: macaulay-layout-evidence
          if-no-files-found: error
