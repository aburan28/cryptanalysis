name: n83 Q1092 fresh holdout M32 continuation

on:
  push:
    branches:
      - codex/koblitz-pair-claw-toy
    paths:
      - "experiments/koblitz-pair-claw-20260929/n83_q1092_holdout_m32_continuation_plan.json"

permissions:
  contents: read

jobs:
  physical-x86-holdout-wave:
    if: github.ref == 'refs/heads/codex/koblitz-pair-claw-toy'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
