name: Packed algebraic proofs
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packed-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    name: Packed proofs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cxx: g++}
          - {os: macos-latest, cxx: clang++}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build independent libraries and UBSan trap variants
        run: python experiments/groebner-perf-20260924/round11/build.py
      - name: Independent oracle, adversarial, wide-ring, and ABI checks
        run: python -m unittest discover -s experiments/groebner-perf-20260924/round11 -p 'test_*.py' -v
      - name: Audit retained measurements
        run: python experiments/groebner-perf-20260924/round11/audit.py
