name: prime-j0-axis152

on:
  pull_request:
    paths:
      - ".github/workflows/prime-j0-axis152.yml"
      - "experiments/prime-j0-axis152-20261012/**"
      - "experiments/prime-j0-axis416-20261012/**"
      - "experiments/prime-j0-secp256k1-native/**"
      - "experiments/prime-j0-radix919-terminal-unit-20261012/**"
      - "experiments/prime-j0-sector-digit-20261010/fresh-inputs.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Lean sixteen-step and sector proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install elan for pinned Lean
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit theorem modules
        run: python3 experiments/prime-j0-axis152-20261012/check.py --check

  exact_replay:
    name: Exact census and two independent public-point panels
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct the exact radix and table certificates
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-axis152-20261012/search.py --check
          python3 experiments/prime-j0-axis152-20261012/screen.py --check
      - name: Replay both disjoint public-point panels
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-axis152-20261012/holdout.py --check
          python3 experiments/prime-j0-axis152-20261012/holdout_replay.py --check
          python3 experiments/prime-j0-axis152-20261012/holdout2.py --check
          python3 experiments/prime-j0-axis152-20261012/holdout2_replay.py --check

  native:
    name: Locked Rust build and two native public-point panels
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/axis152-native-target
    steps:
      - uses: actions/checkout@v4
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path experiments/prime-j0-secp256k1-native/Cargo.toml
      - name: Build disposable native evaluator
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-axis152-20261012/native_overlay.py \
            "$RUNNER_TEMP/axis152-native-overlay" --build
      - name: Audit atlases and public points
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-axis152-20261012/native_replay.py \
            --binary "$CARGO_TARGET_DIR/release/eisenstein_fixed" \
            --overlay-record "$RUNNER_TEMP/axis152-native-overlay/overlay.json" --check
          python3 experiments/prime-j0-axis152-20261012/native_replay2.py \
            --binary "$CARGO_TARGET_DIR/release/eisenstein_fixed" \
            --overlay-record "$RUNNER_TEMP/axis152-native-overlay/overlay.json" --check
