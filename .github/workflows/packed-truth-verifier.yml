name: Independent packed truth verification
on:
  pull_request:
    paths:
      - 'experiments/groebner-perf-20260924/round18/**'
      - 'experiments/groebner-perf-20260924/round17/**'
      - 'experiments/groebner-perf-20260924/round15/**'
      - 'experiments/groebner-perf-20260924/round14/**'
      - 'experiments/groebner-perf-20260924/round4/**'
      - 'experiments/groebner-perf-20260924/round2/**'
      - 'experiments/pdp-degree-heuristics/pdpkernel.c'
      - 'experiments/pdp-scaling/**'
      - '.github/workflows/packed-truth-verifier.yml'
  push:
    paths:
      - 'experiments/groebner-perf-20260924/round18/**'
      - 'experiments/groebner-perf-20260924/round17/**'
      - 'experiments/groebner-perf-20260924/round15/**'
      - 'experiments/groebner-perf-20260924/round14/**'
      - 'experiments/groebner-perf-20260924/round4/**'
      - 'experiments/groebner-perf-20260924/round2/**'
      - 'experiments/pdp-degree-heuristics/pdpkernel.c'
      - 'experiments/pdp-scaling/**'
      - '.github/workflows/packed-truth-verifier.yml'
permissions:
  contents: read
concurrency:
  group: packed-truth-verifier-${{ github.ref }}
  cancel-in-progress: true
jobs:
  correctness:
    name: Packed truth verifier (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build native replay and query dependencies
        run: |
          python experiments/groebner-perf-20260924/round4/build.py
          python experiments/groebner-perf-20260924/round14/build.py
          python experiments/groebner-perf-20260924/round15/build.py
          python experiments/groebner-perf-20260924/round17/build.py
          python experiments/groebner-perf-20260924/round18/build.py
      - name: Independent replay, ABI, complete queries, admission and audit checks
        run: python -m unittest discover -s experiments/groebner-perf-20260924/round18 -p 'test_*.py' -v
      - name: Retained evidence and source identities
        run: python experiments/groebner-perf-20260924/round18/verify_evidence.py
      - name: Paired complete CPU queries when the runner passes admission
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          out = pathlib.Path('packed-truth-measurement')
          out.mkdir()
          metadata = {name: os.environ.get(name) for name in
              ('GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_OS',
               'RUNNER_ARCH', 'GITHUB_WORKFLOW_REF')}
          cpuinfo = pathlib.Path('/proc/cpuinfo')
          if cpuinfo.exists():
              metadata['cpu'] = {}
              for line in cpuinfo.read_text().splitlines():
                  key, separator, value = line.partition(':')
                  if separator and key.strip() in ('model name', 'vendor_id', 'cpu cores', 'cache size'):
                      metadata['cpu'].setdefault(key.strip(), value.strip())
          (out/'runner.json').write_text(json.dumps(metadata, indent=2)+'\n')
          root = pathlib.Path('experiments/groebner-perf-20260924/round18')
          report = out/'paired.json.gz'
          run = subprocess.run([sys.executable, str(root/'benchmark.py'),
                                '--repetitions', '31', '--output', str(report)])
          if run.returncode == 2:
              admission = json.loads(pathlib.Path(str(report)+'.admission.json').read_text())
              assert not admission['admitted'] and admission['timed_attempts'] == 0
              assert not report.exists()
          else:
              run.check_returncode()
              with (out/'audit.json').open('w') as target:
                  subprocess.run([sys.executable, str(root/'audit.py'), str(report)],
                                 stdout=target, check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: packed-truth-measurement-${{ matrix.os }}
          path: packed-truth-measurement/
          if-no-files-found: ignore
          retention-days: 14
