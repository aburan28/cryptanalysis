name: Ordered sparse reduction
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ordered-reduction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    name: Reduction traces (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cxx: g++}
          - {os: macos-latest, cxx: clang++}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build baseline, ablations and UBSan trap variants
        run: python experiments/groebner-perf-20260924/round12/build.py
      - name: Exact trace, independent oracle and boundary checks
        run: python -m unittest discover -s experiments/groebner-perf-20260924/round12 -p 'test_*.py' -v
      - name: Audit frozen paired measurements
        run: python experiments/groebner-perf-20260924/round12/verify_evidence.py
