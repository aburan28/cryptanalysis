name: N83 K1 replay (kS, kP, kP, kS) and timed K600 base construction

# Runs experiments/koblitz-n83-replay-20261017/PROTOCOL.md, frozen in the
# commit before this workflow. Not a PR job: it runs on a push to the
# dedicated replay branch, or by hand with a chosen runner label so the
# replay can be sent to another host class. The restore, toolchain, build and
# log-table steps are copied unchanged from n83-stacked.yml (the frozen
# producer); the replay driver calls the stacked experiment's
# run_schedule.one() and arm.py unchanged.
on:
  push:
    branches: [claude/n83-replay-run, 'claude/n83-replay-run-*']
  workflow_dispatch:
    inputs:
      runs_on:
        description: "Runner label (e.g. ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm)"
        required: false
        default: ubuntu-24.04

permissions:
  contents: read

concurrency:
  group: n83-replay-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPERIMENT: experiments/koblitz-n83-stacked-20261016
  REPLAY: experiments/koblitz-n83-replay-20261017
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: never

jobs:
  replay:
    runs-on: ${{ inputs.runs_on || 'ubuntu-24.04' }}
    # Build about 10 min, four rank processes about 40 min on the original
    # runner (more on a slower host), two cold processes about 1 min.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Check the frozen replay driver against the protocol
        shell: bash
        run: |
          set -euo pipefail
          want="$(grep -o 'replay.py` (driver and analysis, this commit) | `[0-9a-f]\{64\}' "$REPLAY/PROTOCOL.md" | grep -o '[0-9a-f]\{64\}')"
          echo "$want  $REPLAY/replay.py" | sha256sum -c -

      - name: Record the host class
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/n83-replay"
          mkdir -p "$receipt_dir"
          {
            echo "N83_JOB_START=$(date +%s)"
            echo "N83_RECEIPT_DIR=$receipt_dir"
            echo "N83_CRYPTO_REPO=$RUNNER_TEMP/n83-replay-crypto"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/n83-replay-cargo"
          } >> "$GITHUB_ENV"
          lscpu | tee "$receipt_dir/lscpu.txt"
          python3 scripts/isolated_bench.py probe-host > "$receipt_dir/host-probe.json"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          cpuinfo = Path('/proc/cpuinfo').read_text().splitlines()
          model = next((line.split(':', 1)[1].strip() for line in cpuinfo
                        if line.startswith('model name')), None)
          receipt = {
              'provider': 'github_actions',
              'requested_runs_on': os.environ.get('REQUESTED_RUNS_ON') or 'ubuntu-24.04',
              'instance_id': 'gh-{}-{}-{}'.format(os.environ['GITHUB_RUN_ID'],
                                                  os.environ['GITHUB_RUN_ATTEMPT'],
                                                  os.environ['GITHUB_JOB']),
              'runner_name': os.environ.get('RUNNER_NAME'),
              'runner_arch': os.environ.get('RUNNER_ARCH'),
              'image_os': os.environ.get('ImageOS'),
              'image_version': os.environ.get('ImageVersion'),
              'cpu_model': model,
              'original_cpu_model': 'AMD EPYC 9V74 80-Core Processor',
              'another_host_class': model != 'AMD EPYC 9V74 80-Core Processor',
              'nproc': os.cpu_count(),
              'observed_cpu_affinity': sorted(os.sched_getaffinity(0)),
              'observed_mem_total_kib': next((line.split()[1] for line in
                  Path('/proc/meminfo').read_text().splitlines()
                  if line.startswith('MemTotal:')), None),
              'lscpu': subprocess.run(['lscpu', '-J'], capture_output=True, text=True).stdout,
              'git_sha': os.environ['GITHUB_SHA'],
              'git_ref': os.environ['GITHUB_REF'],
              'run_url': '{}/{}/actions/runs/{}'.format(os.environ['GITHUB_SERVER_URL'],
                  os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_RUN_ID']),
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          path = Path(os.environ['RUNNER_TEMP']) / 'n83-replay' / 'host-class.json'
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps({k: receipt[k] for k in ('cpu_model', 'another_host_class', 'runner_arch')}))
          PY
        env:
          REQUESTED_RUNS_ON: ${{ inputs.runs_on }}

      - name: Restore the pinned crypto revision and check the frozen sources, inputs and schedule
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/aburan28/crypto.git "$N83_CRYPTO_REPO"
          git -C "$N83_CRYPTO_REPO" cat-file -e "770f6a6925a0d29b768bd79074f54a173e967fe7^{commit}"
          python3 "$EXPERIMENT/restore.py" --crypto-repo "$N83_CRYPTO_REPO" | tee "$N83_RECEIPT_DIR/restore.json"
          python3 "$EXPERIMENT/make_schedule.py" --check
          python3 "$EXPERIMENT/make_targets.py" --check
          python3 "$EXPERIMENT/make_online_source.py" --check
          sha256sum "$EXPERIMENT/protocol.json" "$EXPERIMENT/schedule.json" | tee "$N83_RECEIPT_DIR/frozen.sha256"

      - name: Install the pinned toolchain, build and test the online crate
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc --version | tee "$N83_RECEIPT_DIR/rustc.txt"
          (cd "$EXPERIMENT/lift2" && cargo test --release --locked 2>&1 | tee "$N83_RECEIPT_DIR/cargo-test-lift2.txt")
          (cd "$EXPERIMENT/online" && cargo test --release --locked --bins 2>&1 | tee "$N83_RECEIPT_DIR/cargo-test-online.txt")
          (cd "$EXPERIMENT/online" && cargo build --release --locked)
          sha256sum "$CARGO_TARGET_DIR"/release/{ic_online_stacked_r770,rho_tuned_r770} \
            | tee "$N83_RECEIPT_DIR/binaries.sha256"

      - name: Re-verify B's archived factor-log table in the pinned oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 "$EXPERIMENT/check_log_table.py" --out "$N83_RECEIPT_DIR/log-table-check.json"
          table="$(python3 -c 'import json,sys,os; p=json.load(open(sys.argv[1])); print(os.path.realpath(os.path.join(sys.argv[2], p["online"]["factor_log_table"])))' "$EXPERIMENT/protocol.json" "$EXPERIMENT")"
          echo "N83_LOG_TABLE=$table" >> "$GITHUB_ENV"

      - name: Run R1-R6 on one pinned CPU (kS, kP, kP, kS, cS retained, cS construct)
        shell: bash
        run: |
          set +e
          cpu_id="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          python3 "$REPLAY/replay.py" run --bin-dir "$CARGO_TARGET_DIR/release" \
            --log-table "$N83_LOG_TABLE" --receipt-dir "$N83_RECEIPT_DIR/panel" --cpu "$cpu_id" \
            > "$N83_RECEIPT_DIR/runner-stdout.jsonl"
          echo "replay_exit=$?" | tee "$N83_RECEIPT_DIR/replay-exit.txt"

      - name: Apply the frozen pass / fail rule
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 "$REPLAY/replay.py" analyze --receipt-dir "$N83_RECEIPT_DIR/panel" \
            | tee "$N83_RECEIPT_DIR/analyze-stdout.json"
          cat "$N83_RECEIPT_DIR/panel/replay_result.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve host class, builds, raw runs and the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-replay/
          if-no-files-found: error
          retention-days: 30
