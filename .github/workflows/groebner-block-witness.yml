name: Groebner block witness
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build and verify block witness
        env:
          CXX: clang++
        run: python experiments/groebner-perf-20260924/round108/run_validation.py --output groebner-block-witness-evidence
      - name: Retain successes and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groebner-block-witness-${{ matrix.os }}
          path: groebner-block-witness-evidence
          if-no-files-found: error
