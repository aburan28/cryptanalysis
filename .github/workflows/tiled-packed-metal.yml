name: Tiled packed Metal verification
on:
  pull_request:
    paths:
      - 'experiments/groebner-perf-20260924/round19/**'
      - 'experiments/groebner-perf-20260924/round18/**'
      - 'experiments/groebner-perf-20260924/round17/**'
      - 'experiments/groebner-perf-20260924/round15/**'
      - 'experiments/groebner-perf-20260924/round14/**'
      - 'experiments/groebner-perf-20260924/round4/**'
      - 'experiments/groebner-perf-20260924/round2/**'
      - 'experiments/pdp-degree-heuristics/pdpkernel.c'
      - 'experiments/pdp-scaling/**'
      - '.github/workflows/tiled-packed-metal.yml'
  push:
    paths:
      - 'experiments/groebner-perf-20260924/round19/**'
      - '.github/workflows/tiled-packed-metal.yml'
permissions:
  contents: read
concurrency:
  group: tiled-packed-metal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  correctness:
    name: Tiled Metal verifier (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Portable admission, source generation and evidence audit
        run: |
          python -m unittest discover -s experiments/groebner-perf-20260924/round19 -p 'test_a*.py' -v
          python experiments/groebner-perf-20260924/round19/verify_evidence.py
      - name: Build CPU and Metal query dependencies
        if: runner.os == 'macOS'
        run: |
          python experiments/groebner-perf-20260924/round4/build.py
          python experiments/groebner-perf-20260924/round14/build.py
          python experiments/groebner-perf-20260924/round15/build.py
          python experiments/groebner-perf-20260924/round17/build.py
          python experiments/groebner-perf-20260924/round18/build.py
          python experiments/groebner-perf-20260924/round19/build.py
          python experiments/groebner-perf-20260924/round19/build_tiles.py
      - name: Exact device and complete-query correctness
        if: runner.os == 'macOS'
        run: |
          mkdir -p tiled-metal-measurement
          experiments/groebner-perf-20260924/round19/build/test-tiles experiments/groebner-perf-20260924/round19/tiled_truth.metal 256 > tiled-metal-measurement/tiles-optimized.log
          experiments/groebner-perf-20260924/round19/build/test-tiles-ubsan experiments/groebner-perf-20260924/round19/tiled_truth.metal 64 > tiled-metal-measurement/tiles-ubsan.log
          python -m unittest discover -s experiments/groebner-perf-20260924/round19 -p 'test_gpu.py' -v > tiled-metal-measurement/correctness.log 2>&1
      - name: Complete-query measurement after bounded load admission
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          out = pathlib.Path('tiled-metal-measurement')
          out.mkdir(exist_ok=True)
          metadata = {name: os.environ.get(name) for name in
              ('GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_OS',
               'RUNNER_ARCH', 'GITHUB_WORKFLOW_REF')}
          (out/'runner.json').write_text(json.dumps(metadata, indent=2)+'\n')
          root = pathlib.Path('experiments/groebner-perf-20260924/round19')
          report = out/'paired.json.gz'
          run = subprocess.run([sys.executable, str(root/'benchmark.py'), '--repetitions', '31',
                                '--admission-wait-seconds', '240', '--output', str(report)])
          if run.returncode == 2:
              admission = json.loads(pathlib.Path(str(report)+'.admission.json').read_text())
              assert not admission['admitted'] and admission['timed_attempts'] == 0
              assert not report.exists()
          else:
              run.check_returncode()
              with (out/'audit.json').open('w') as target:
                  subprocess.run([sys.executable, str(root/'audit.py'), str(report)],
                                 stdout=target, check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: tiled-metal-measurement-${{ matrix.os }}
          path: tiled-metal-measurement/
          if-no-files-found: ignore
          retention-days: 14
