name: N83 A/B reconciliation factorial Tier 1

# One fresh GitHub-hosted ubuntu-24.04 runner is the Tier 1 instance. The
# frozen protocol is experiments/koblitz-n83-reconcile-20261014/protocol.json
# and the frozen run order is schedule.json next to it: four Q0 blocks (every
# rho arm x seed and every IC arm once each) interleaved with B's 16 fresh
# points, every arm one pinned process at a time. B's restore, patch and
# factor-log table are reused from experiments/koblitz-single-target-n83-
# tier1-20261014. Nothing here promotes a result; verify_receipt.py audits the
# receipt and applies the frozen decision rule.
on:
  push:
    branches: [claude/n83-reconcile]
    paths:
      - experiments/koblitz-n83-reconcile-20261014/**
      - .github/workflows/n83-reconcile.yml
      - '!experiments/koblitz-n83-reconcile-20261014/run_github_*/**'
      - '!experiments/koblitz-n83-reconcile-20261014/README.md'
      - '!experiments/koblitz-n83-reconcile-20261014/README.pdf'
      - '!experiments/koblitz-n83-reconcile-20261014/SOURCE_AUDIT.md'
      - '!experiments/koblitz-n83-reconcile-20261014/SOURCE_AUDIT.pdf'
      - '!experiments/koblitz-n83-reconcile-20261014/figures/**'
      - '!experiments/koblitz-n83-reconcile-20261014/result*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-reconcile-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPERIMENT: experiments/koblitz-n83-reconcile-20261014
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: never

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Freeze runner and source identity
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/n83-reconcile"
          mkdir -p "$receipt_dir"
          {
            echo "N83_JOB_START=$(date +%s)"
            echo "N83_RECEIPT_DIR=$receipt_dir"
            echo "N83_CRYPTO_REPO=$RUNNER_TEMP/n83-reconcile-crypto"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/n83-reconcile-cargo"
          } >> "$GITHUB_ENV"
          python3 scripts/isolated_bench.py probe-host > "$receipt_dir/host-probe.json"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              'provider': 'github_actions',
              'instance_id': 'gh-{}-{}-{}'.format(os.environ['GITHUB_RUN_ID'],
                                                  os.environ['GITHUB_RUN_ATTEMPT'],
                                                  os.environ['GITHUB_JOB']),
              'runner_name': os.environ.get('RUNNER_NAME'),
              'image_os': os.environ.get('ImageOS'),
              'image_version': os.environ.get('ImageVersion'),
              'advertised_runner': 'ubuntu-24.04 standard (4 vCPU, 16 GB)',
              'observed_cpu_affinity': sorted(os.sched_getaffinity(0)),
              'observed_cpu_model': next((line.split(':', 1)[1].strip() for line in
                  Path('/proc/cpuinfo').read_text().splitlines()
                  if line.startswith('model name')), None),
              'observed_mem_total_kib': next((line.split()[1] for line in
                  Path('/proc/meminfo').read_text().splitlines()
                  if line.startswith('MemTotal:')), None),
              'transparent_hugepage': {name: (Path('/sys/kernel/mm/transparent_hugepage') / name).read_text().strip()
                                       for name in ('enabled', 'defrag')
                                       if (Path('/sys/kernel/mm/transparent_hugepage') / name).exists()},
              'git_sha': os.environ['GITHUB_SHA'],
              'git_ref': os.environ['GITHUB_REF'],
              'run_url': '{}/{}/actions/runs/{}'.format(os.environ['GITHUB_SERVER_URL'],
                  os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_RUN_ID']),
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          path = Path(os.environ['RUNNER_TEMP']) / 'n83-reconcile' / 'allocation.json'
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

      - name: Restore both pinned crypto revisions and check the frozen schedule
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/aburan28/crypto.git "$N83_CRYPTO_REPO"
          for commit in a8194d616ed8c04489ec46177d369f1b1670360a 770f6a6925a0d29b768bd79074f54a173e967fe7; do
            git -C "$N83_CRYPTO_REPO" cat-file -e "${commit}^{commit}"
          done
          python3 "$EXPERIMENT/restore_sources.py" --crypto-repo "$N83_CRYPTO_REPO"
          python3 "$EXPERIMENT/make_schedule.py" --check
          sha256sum "$EXPERIMENT/protocol.json" "$EXPERIMENT/schedule.json" | tee "$N83_RECEIPT_DIR/frozen.sha256"

      - name: Install the pinned toolchain, build and test both crates
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc --version | tee "$N83_RECEIPT_DIR/rustc.txt"
          for crate in r819 r770; do
            (cd "$EXPERIMENT/crates/$crate" && cargo test --release --locked --bins 2>&1 | tee "$N83_RECEIPT_DIR/cargo-test-$crate.txt")
            (cd "$EXPERIMENT/crates/$crate" && cargo build --release --locked)
          done
          sha256sum "$CARGO_TARGET_DIR"/release/{ic_fast_r819,rho_adapter_r819,ic_online_logcache_r770,ic_fast_r770,rho_rung3_r770,rho_adapter_r770,rho_tuned_r770} \
            | tee "$N83_RECEIPT_DIR/binaries.sha256"

      - name: Re-verify B's archived factor-log table in the pinned oracle
        shell: bash
        run: |
          set -euo pipefail
          table="experiments/koblitz-single-target-n83-tier1-20261014/tier1_github_38523707244/precompute/factor_logs_n83_K600.json"
          expected="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sources"]["reused_from_B"]["factor_log_table_sha256"])' "$EXPERIMENT/protocol.json")"
          python3 "$EXPERIMENT/verify_log_table.py" --table "$table" --expect-sha256 "$expected" \
            --out "$N83_RECEIPT_DIR/log-table-check.json"
          echo "N83_LOG_TABLE=$GITHUB_WORKSPACE/$table" >> "$GITHUB_ENV"

      - name: Run the frozen interleaved schedule on one pinned CPU
        shell: bash
        run: |
          set +e
          cpu_id="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          python3 "$EXPERIMENT/run_schedule.py" --bin-dir "$CARGO_TARGET_DIR/release" \
            --log-table "$N83_LOG_TABLE" --receipt-dir "$N83_RECEIPT_DIR/panel" --cpu "$cpu_id" \
            --job-start-epoch "$N83_JOB_START" --deadline-min 325 > "$N83_RECEIPT_DIR/runner-stdout.jsonl"
          echo "schedule_exit=$?" | tee "$N83_RECEIPT_DIR/schedule-exit.txt"

      - name: Audit the receipt and apply the frozen decision rule
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 "$EXPERIMENT/verify_receipt.py" "$N83_RECEIPT_DIR/panel" | tee "$N83_RECEIPT_DIR/verify-stdout.json"
          cat "$N83_RECEIPT_DIR/panel/result_table.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve allocation, builds, raw runs, tables and the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-reconcile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-reconcile/
          if-no-files-found: error
          retention-days: 30
