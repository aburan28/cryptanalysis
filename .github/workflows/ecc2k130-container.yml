name: ECC2K-130 container

# Build the production runner in GitHub's x86_64 builder.  The image contains
# native cubins for every supported production GPU, so RunPod only needs to
# select the card; the entrypoint checks its compute capability at startup.
#
# Pull requests build and smoke-test the image without publishing it.  Pushes
# and manual runs publish ghcr.io/<owner>/ecc2k130-runner.  A manual run can
# override the architecture list when a new CUDA target is added.

on:
  push:
    branches: ["**"]
    paths:
      - "ecc2k130/runner/**"
      - ".github/workflows/ecc2k130-container.yml"
  pull_request:
    paths:
      - "ecc2k130/runner/**"
      - ".github/workflows/ecc2k130-container.yml"
  workflow_dispatch:
    inputs:
      ecc_cuda_arches:
        description: "Space-separated CUDA SMs to compile into the image"
        required: false
        default: "80 86 89 90 100 120"
        type: string
      push_image:
        description: "Publish the image to GHCR"
        required: true
        default: true
        type: boolean
      runpod_campaign:
        description: "Launch one RTX PRO 6000 S3-backed ECC2K-130 worker"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ecc2k130-container-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  image:
    name: build and smoke-test linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      ECC_CUDA_ARCHES: ${{ inputs.ecc_cuda_arches || '80 86 89 90 100 120' }}
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --file ecc2k130/runner/deploy/Dockerfile \
            --build-arg "ECC_CUDA_ARCHES=${ECC_CUDA_ARCHES}" \
            --tag ecc2k130-runner:ci \
            ecc2k130/runner

      - name: Smoke-test entrypoint and image metadata
        run: |
          set -euo pipefail
          docker run --rm \
            --env ECC_SKIP_GPU_CHECK=1 \
            --env ECC_CLIENT=/bin/true \
            ecc2k130-runner:ci /bin/true
          docker image inspect ecc2k130-runner:ci \
            --format 'image={{.Id}} size={{.Size}} bytes'

      - name: Publish to GHCR
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/ecc2k130-runner"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker tag ecc2k130-runner:ci "${image}:sha-${GITHUB_SHA}"
          docker push "${image}:sha-${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            docker tag ecc2k130-runner:ci "${image}:latest"
            docker push "${image}:latest"
          fi
          {
            echo "### ECC2K-130 image"
            echo
            echo "Published: \`${image}:sha-${GITHUB_SHA}\`"
            echo "CUDA SMs: \`${ECC_CUDA_ARCHES}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  runpod-campaign:
    name: RunPod RTX PRO 6000 ECC2K-130 worker
    needs: image
    # The branch clause starts the requested worker on this isolated branch;
    # normal users opt in with workflow_dispatch instead of paying for every push.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.runpod_campaign) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/ecc2k130-gpu-container-20261011')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_SSH_PRIVATE_KEY: ${{ secrets.RUNPOD_SSH_PRIVATE_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-2
      ECC_BUCKET: ${{ secrets.ECC_BUCKET }}
      ECC_PREFIX: campaigns/ecc2k130-frobenius32-120k-v1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Install runpodctl
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 \
            -o "${RUNNER_TEMP}/runpodctl"
          chmod +x "${RUNNER_TEMP}/runpodctl"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Prepare credentials
        run: |
          set -euo pipefail
          [[ -n "${RUNPOD_API_KEY:-}" ]] || {
            echo "RUNPOD_API_KEY repository secret is required for runpod_campaign" >&2
            exit 1
          }
          [[ -n "${RUNPOD_SSH_PRIVATE_KEY:-}" ]] || {
            echo "RUNPOD_SSH_PRIVATE_KEY repository secret is required for runpod_campaign" >&2
            exit 1
          }
          [[ -n "${AWS_ACCESS_KEY_ID:-}" && -n "${AWS_SECRET_ACCESS_KEY:-}" && -n "${ECC_BUCKET:-}" ]] || {
            echo "AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and ECC_BUCKET repository secrets are required" >&2
            exit 1
          }
          export HOME="${RUNNER_TEMP}/home"
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${RUNPOD_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          ssh-keygen -y -f "${HOME}/.ssh/id_ed25519" > "${HOME}/.ssh/id_ed25519.pub"
          echo "HOME=${HOME}" >> "${GITHUB_ENV}"

      - name: Register temporary GHCR credential with RunPod
        id: registry
        run: |
          set -euo pipefail
          registry_json="$(printf '%s' "${GH_TOKEN}" | runpodctl registry create \
            --name "ecc2k130-ghcr-${GITHUB_RUN_ID}" \
            --username "${GITHUB_ACTOR}" --password-stdin -o json)"
          registry_id="$(REGISTRY_JSON="${registry_json}" python3 -c \
            'import json, os; print(json.loads(os.environ["REGISTRY_JSON"])["id"])')"
          echo "registry_id=${registry_id}" >> "${GITHUB_OUTPUT}"

      - name: Launch the live ECC2K-130 worker on RTX PRO 6000
        id: pod
        env:
          REGISTRY_ID: ${{ steps.registry.outputs.registry_id }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/ecc2k130-runner:sha-${GITHUB_SHA}"
          start_command='python3 /opt/ecc2k130/cloud.py run --seconds 82800 --s3-only'
          export ECC_START_COMMAND="${start_command}"
          env_json="$(python3 - <<'PY'
          import json, os
          values = {
              "AWS_ACCESS_KEY_ID": os.environ["AWS_ACCESS_KEY_ID"],
              "AWS_SECRET_ACCESS_KEY": os.environ["AWS_SECRET_ACCESS_KEY"],
              "AWS_DEFAULT_REGION": os.environ["AWS_DEFAULT_REGION"],
              "ECC_BUCKET": os.environ["ECC_BUCKET"],
              "ECC_PREFIX": os.environ["ECC_PREFIX"],
              "ECC_START_COMMAND": os.environ["ECC_START_COMMAND"],
          }
          if os.environ.get("AWS_SESSION_TOKEN"):
              values["AWS_SESSION_TOKEN"] = os.environ["AWS_SESSION_TOKEN"]
          print(json.dumps(values))
          PY
          )"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pod_json="$(runpodctl pod create \
            --image "${image}" \
            --gpu-id "NVIDIA RTX PRO 6000 Blackwell Server Edition" \
            --name "ecc2k130-frobenius32-pro6000-${GITHUB_RUN_ID}" \
            --container-disk-in-gb 30 --ports "22/tcp" \
            --registry-auth-id "${REGISTRY_ID}" \
            --env "${env_json}" \
            --wait --wait-timeout 10m -o json)"
          pod_id="$(POD_JSON="${pod_json}" python3 -c \
            'import json, os; print(json.loads(os.environ["POD_JSON"])["id"])')"
          echo "pod_id=${pod_id}" >> "${GITHUB_OUTPUT}"
          echo "started_at=${started_at}" >> "${GITHUB_OUTPUT}"

          info_json="$(runpodctl ssh info "${pod_id}" -o json)"
          eval "$(INFO_JSON="${info_json}" python3 -c '
          import json, os, shlex
          d = json.loads(os.environ["INFO_JSON"])
          print("SSH_HOST=" + shlex.quote(str(d["ip"])))
          print("SSH_PORT=" + shlex.quote(str(d.get("port", 22))))
          print("SSH_USER=" + shlex.quote(str(d.get("user", "root"))))
          ')"

          ssh_opts=(
            -i "${HOME}/.ssh/id_ed25519" -p "${SSH_PORT}"
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts_runpod"
            -o IdentitiesOnly=yes -o BatchMode=yes
          )
          ssh "${ssh_opts[@]}" "${SSH_USER}@${SSH_HOST}" 'set -euo pipefail
            nvidia-smi --query-gpu=name,compute_cap --format=csv,noheader
            pgrep -af "cloud.py|ecc2k130" || true'

          echo "Pod ${pod_id} is live and running the S3-backed worker."
          echo "pod_id=${pod_id}" >> "${GITHUB_STEP_SUMMARY}"
          echo "S3 prefix=${ECC_BUCKET}/${ECC_PREFIX}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Confirm a fresh checkpoint or DP upload
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
          STARTED_AT: ${{ steps.pod.outputs.started_at }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'boto3>=1.38,<2'
          for attempt in 1 2 3 4 5; do
            if STARTED_AT="${STARTED_AT}" python3 - <<'PY'
          import boto3, datetime, os, sys
          bucket=os.environ["ECC_BUCKET"]
          prefix=os.environ["ECC_PREFIX"] + "/"
          since=datetime.datetime.fromisoformat(os.environ["STARTED_AT"].replace("Z", "+00:00"))
          s3=boto3.client("s3")
          fresh=[]
          token=None
          while True:
              args={"Bucket":bucket,"Prefix":prefix,"MaxKeys":1000}
              if token: args["ContinuationToken"]=token
              page=s3.list_objects_v2(**args)
              fresh.extend(o for o in page.get("Contents", []) if o["LastModified"] >= since)
              if not page.get("IsTruncated"): break
              token=page.get("NextContinuationToken")
              if len(fresh) >= 1: break
          relevant=[o for o in fresh if "/ckpt/" in o["Key"] or "/dp/" in o["Key"]]
          if relevant:
              print("fresh_uploads", [(o["Key"], o["Size"]) for o in relevant[:5]])
              sys.exit(0)
          print("no fresh checkpoint or DP object yet")
          sys.exit(1)
          PY
            then
              echo "Confirmed a fresh S3 upload for ${POD_ID}."
              exit 0
            fi
            sleep 60
          done
          echo "Worker is running, but no fresh S3 checkpoint/DP object appeared yet." >&2
          runpodctl pod logs "${POD_ID}" --tail 80 --source container || true
          exit 1

      - name: Remove temporary registry credential
        if: always()
        env:
          REGISTRY_ID: ${{ steps.registry.outputs.registry_id }}
        run: |
          set +e
          [[ -n "${REGISTRY_ID:-}" ]] && runpodctl registry delete "${REGISTRY_ID}"
