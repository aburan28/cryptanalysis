name: Prepared constant identity checking

on:
  pull_request:
    paths:
      - 'experiments/groebner-perf-20260924/**'
      - 'experiments/pdp-scaling/**'
      - 'experiments/pdp-degree-heuristics/**'
      - '.github/workflows/prepared-constant-identities.yml'
  push:
    paths:
      - 'experiments/groebner-perf-20260924/**'
      - 'experiments/pdp-scaling/**'
      - 'experiments/pdp-degree-heuristics/**'
      - '.github/workflows/prepared-constant-identities.yml'

permissions:
  contents: read

concurrency:
  group: prepared-constant-identities-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    name: Prepared constant identity checking (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install numpy==2.4.0
      - name: Build portable dependencies and selected backend
        shell: bash
        run: |
          mkdir -p prepared-constant-identities-evidence
          for version in 20 23 31 32 33 34 35 36 37 38; do
            python "experiments/groebner-perf-20260924/round${version}/build.py" > "prepared-constant-identities-evidence/build-${version}.log" 2>&1
          done
          flags=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            flags+=(--metal)
          fi
          python experiments/groebner-perf-20260924/round44/build.py "${flags[@]}" > prepared-constant-identities-evidence/build-44.log 2>&1
          python experiments/groebner-perf-20260924/round48/build.py > prepared-constant-identities-evidence/build-48.log 2>&1
          python experiments/groebner-perf-20260924/round49/build.py "${flags[@]}" > prepared-constant-identities-evidence/build-49.log 2>&1
          python experiments/groebner-perf-20260924/round51/build.py "${flags[@]}" > prepared-constant-identities-evidence/build-51.log 2>&1
          python experiments/groebner-perf-20260924/round52/build.py > prepared-constant-identities-evidence/build-52.log 2>&1
          python experiments/groebner-perf-20260924/round53/build.py > prepared-constant-identities-evidence/build-53.log 2>&1
          python experiments/groebner-perf-20260924/round54/build.py > prepared-constant-identities-evidence/build-54.log 2>&1
          python experiments/groebner-perf-20260924/round65/build.py "${flags[@]}" > prepared-constant-identities-evidence/build-65.log 2>&1
          python experiments/groebner-perf-20260924/round66/build.py > prepared-constant-identities-evidence/kernel-build.log 2>&1
          python experiments/groebner-perf-20260924/round66/native_build.py "${flags[@]}" > prepared-constant-identities-evidence/native-build.log 2>&1
      - name: Detect actual Metal availability
        if: runner.os == 'macOS'
        working-directory: experiments/groebner-perf-20260924/round66
        run: |
          python - <<'PYTHON'
          import os
          from adapter import Checker
          try:
              with Checker(2, 3, 3, transform_backend='metal') as probe:
                  print('METAL_AVAILABLE', probe.transform_device)
          except RuntimeError as error:
              if str(error) != 'requested independent Metal transform unavailable':
                  raise
              print('METAL_UNAVAILABLE', error)
          else:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('INDEPENDENT_TEST_METAL=1\n')
          PYTHON
      - name: Exercise kernels and complete certificate failures
        shell: bash
        run: |
          experiments/groebner-perf-20260924/round66/build/test-constant > prepared-constant-identities-evidence/test-constant.log 2>&1
          experiments/groebner-perf-20260924/round66/build/test-constant-ubsan > prepared-constant-identities-evidence/test-constant-ubsan.log 2>&1
          python -m unittest discover -s experiments/groebner-perf-20260924/round66 -p 'test_checker.py' -v > prepared-constant-identities-evidence/unit-tests.log 2>&1
      - name: Validate fresh complete queries
        shell: bash
        run: |
          flags=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            flags+=(--metal)
          fi
          python -u experiments/groebner-perf-20260924/round66/validate_queries.py "${flags[@]}" --output prepared-constant-identities-evidence/correctness.json.gz > prepared-constant-identities-evidence/validation.log 2>&1
      - name: Retain rebuilt binaries and actual runner identity
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib, platform, shutil, subprocess
          out = pathlib.Path('prepared-constant-identities-evidence')
          out.mkdir(exist_ok=True)
          metadata = {k: os.environ.get(k) for k in ('GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_OS', 'RUNNER_ARCH')}
          metadata.update(platform=platform.platform(), architecture=platform.machine(),
              git_head=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              worktree_status=subprocess.check_output(['git', 'status', '--porcelain', '--', '.', ':!prepared-constant-identities-evidence'], text=True))
          (out / 'runner.json').write_text(json.dumps(metadata, indent=2)+'\n')
          for build in pathlib.Path('experiments/groebner-perf-20260924').glob('round*/build'):
              shutil.copytree(build, out / 'native' / build.parent.name, dirs_exist_ok=True)
          kernel = pathlib.Path('experiments/pdp-degree-heuristics/build')
          if kernel.exists():
              shutil.copytree(kernel, out / 'native' / 'pdp-degree-heuristics', dirs_exist_ok=True)
          PY
      - name: Audit retained sources, binaries and original polynomial identities
        run: python -u experiments/groebner-perf-20260924/round66/audit.py --evidence prepared-constant-identities-evidence --output prepared-constant-identities-evidence/retained-artifact-audit.json > prepared-constant-identities-evidence/retained-artifact-audit.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-constant-identities-${{ matrix.os }}
          path: prepared-constant-identities-evidence/
          if-no-files-found: error
          retention-days: 14
