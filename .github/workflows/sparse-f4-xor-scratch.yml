name: Sparse F4 bounded XOR scratch

on:
  pull_request:
    paths:
      - 'experiments/groebner-perf-20260924/**'
      - 'experiments/pdp-scaling/**'
      - '.github/workflows/sparse-f4-xor-scratch.yml'
  push:
    paths:
      - 'experiments/groebner-perf-20260924/**'
      - 'experiments/pdp-scaling/**'
      - '.github/workflows/sparse-f4-xor-scratch.yml'

permissions:
  contents: read

concurrency:
  group: sparse-f4-xor-scratch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness-and-timing:
    name: Sparse F4 bounded XOR scratch (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild, preflight, measure and independently audit the frozen panel
        run: python -u experiments/groebner-perf-20260924/round61/run_validation.py --output xor-scratch-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sparse-f4-xor-scratch-${{ matrix.os }}
          path: xor-scratch-evidence/
          if-no-files-found: error
          retention-days: 14
