name: N83 one-target IC versus strong rho Tier 1

# A fresh GitHub-hosted ubuntu-24.04 runner is the Tier 1 instance. The
# frozen protocol is experiments/koblitz-single-target-n83-tier1-20261014/
# tier1_protocol.json: one sequential rank stage, then Panel A (frozen Q0,
# eight interleaved strong-rho/IC pairs), Panel B (16 public points, one pair
# each) and Panel C (legacy packed rho on Q0, eight pairs), every arm through
# scripts/isolated_bench.py. Nothing here promotes a result; the uploaded
# receipt is audited by verify_tier1_receipt.py.
on:
  push:
    branches: [claude/frobenius-orbit-canonicalization-gwmz8z]
    paths:
      - experiments/koblitz-single-target-n83-tier1-20261014/**
      - '!experiments/koblitz-single-target-n83-tier1-20261014/tier1_github_*/**'
      - '!experiments/koblitz-single-target-n83-tier1-20261014/README.md'
      - '!experiments/koblitz-single-target-n83-tier1-20261014/README.pdf'
      - '!experiments/koblitz-single-target-n83-tier1-20261014/figures/tier1_result.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-onetarget-tier1-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPERIMENT: experiments/koblitz-single-target-n83-tier1-20261014
  CRYPTO_COMMIT: 770f6a6925a0d29b768bd79074f54a173e967fe7

jobs:
  onetarget-tier1:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Freeze runner and source identity
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/n83-onetarget-tier1"
          mkdir -p "$receipt_dir"
          {
            echo "N83_RECEIPT_DIR=$receipt_dir"
            echo "N83_INSTANCE_ID=gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
            echo "N83_CRYPTO_REPO=$RUNNER_TEMP/n83-onetarget-crypto"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/n83-onetarget-cargo"
          } >> "$GITHUB_ENV"
          python3 scripts/isolated_bench.py probe-host > "$receipt_dir/host-probe.json"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          instance_id = 'gh-{}-{}-{}'.format(os.environ['GITHUB_RUN_ID'],
                                              os.environ['GITHUB_RUN_ATTEMPT'],
                                              os.environ['GITHUB_JOB'])
          receipt = {
              'provider': 'github_actions',
              'instance_id': instance_id,
              'runner_name': os.environ.get('RUNNER_NAME'),
              'runner_os': os.environ.get('RUNNER_OS'),
              'runner_arch': os.environ.get('RUNNER_ARCH'),
              'image_os': os.environ.get('ImageOS'),
              'image_version': os.environ.get('ImageVersion'),
              'advertised_runner': 'ubuntu-24.04 standard (4 vCPU, 16 GB)',
              'observed_cpu_affinity': sorted(os.sched_getaffinity(0)),
              'observed_cpu_model': next((line.split(':', 1)[1].strip() for line in
                  Path('/proc/cpuinfo').read_text().splitlines()
                  if line.startswith('model name')), None),
              'observed_mem_total_kib': next((line.split()[1] for line in
                  Path('/proc/meminfo').read_text().splitlines()
                  if line.startswith('MemTotal:')), None),
              'git_sha': os.environ['GITHUB_SHA'],
              'git_ref': os.environ['GITHUB_REF'],
              'crypto_commit': os.environ['CRYPTO_COMMIT'],
              'run_url': '{}/{}/actions/runs/{}'.format(os.environ['GITHUB_SERVER_URL'],
                  os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_RUN_ID']),
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          path = Path(os.environ['RUNNER_TEMP']) / 'n83-onetarget-tier1' / 'allocation.json'
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

      - name: Restore pinned crypto source, derive targets, build and test
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/aburan28/crypto.git "$N83_CRYPTO_REPO"
          git -C "$N83_CRYPTO_REPO" cat-file -e "${CRYPTO_COMMIT}^{commit}"
          python3 "$EXPERIMENT/restore_crypto_source.py" --crypto-repo "$N83_CRYPTO_REPO"
          python3 "$EXPERIMENT/make_targets.py" --check
          cd "$EXPERIMENT"
          rustc --version | tee "$N83_RECEIPT_DIR/rustc.txt"
          cargo test --release --locked --bins 2>&1 | tee "$N83_RECEIPT_DIR/cargo-test.txt"
          cargo build --release --locked
          sha256sum "$CARGO_TARGET_DIR"/release/{ic_online_logcache,rho_strong_online,rho_packed_legacy} \
            | tee "$N83_RECEIPT_DIR/binaries.sha256"

      - name: Rank stage once on one pinned CPU and verify the factor-log table
        shell: bash
        run: |
          set -euo pipefail
          cpu_id="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          echo "N83_CPU=$cpu_id" >> "$GITHUB_ENV"
          python3 "$EXPERIMENT/precompute.py" run \
            --binary "$CARGO_TARGET_DIR/release/ic_online_logcache" \
            --cpu "$cpu_id" --out "$N83_RECEIPT_DIR/precompute"

      - name: Freeze the three panel manifests and run the Tier 1 preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 "$EXPERIMENT/make_tier1_manifest.py" \
            --workdir "$GITHUB_WORKSPACE" --bin-dir "$CARGO_TARGET_DIR/release" \
            --log-table "$N83_RECEIPT_DIR/precompute/factor_logs_n83_K600.json" \
            --precompute-receipt "$N83_RECEIPT_DIR/precompute/precompute_receipt.json" \
            --cpus "$N83_CPU" --execution-cpu "$N83_CPU" \
            --provider github_actions --instance-id "$N83_INSTANCE_ID" \
            --allocation-receipt "$N83_RECEIPT_DIR/allocation.json" \
            --output-dir "$N83_RECEIPT_DIR/manifests"
          python3 scripts/isolated_bench.py probe \
            "$N83_RECEIPT_DIR/manifests/manifest_A.json" > "$N83_RECEIPT_DIR/preflight.json"

      - name: Panel A, frozen Q0, eight interleaved strong-rho/IC pairs
        shell: bash
        run: |
          set +e
          python3 scripts/isolated_bench.py --queue-root "$N83_RECEIPT_DIR/queue" run \
            "$N83_RECEIPT_DIR/manifests/manifest_A.json" > "$N83_RECEIPT_DIR/run-summary_A.json"
          echo "panel_A_exit=$?" | tee -a "$N83_RECEIPT_DIR/panel-exits.txt"

      - name: Panel B, sixteen public points, one pair each
        if: always()
        shell: bash
        run: |
          set +e
          python3 scripts/isolated_bench.py --queue-root "$N83_RECEIPT_DIR/queue" run \
            "$N83_RECEIPT_DIR/manifests/manifest_B.json" > "$N83_RECEIPT_DIR/run-summary_B.json"
          echo "panel_B_exit=$?" | tee -a "$N83_RECEIPT_DIR/panel-exits.txt"

      - name: Panel C, legacy packed rho on Q0, eight pairs
        if: always()
        shell: bash
        run: |
          set +e
          python3 scripts/isolated_bench.py --queue-root "$N83_RECEIPT_DIR/queue" run \
            "$N83_RECEIPT_DIR/manifests/manifest_C.json" > "$N83_RECEIPT_DIR/run-summary_C.json"
          echo "panel_C_exit=$?" | tee -a "$N83_RECEIPT_DIR/panel-exits.txt"

      - name: Audit, build and check vs_rho claims, apply the decision rule
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 "$EXPERIMENT/verify_tier1_receipt.py" "$N83_RECEIPT_DIR" \
            | tee "$N83_RECEIPT_DIR/verify-stdout.json"
          cat "$N83_RECEIPT_DIR/tier1_table.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve allocation, precompute, raw pairs, claims and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-onetarget-tier1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-onetarget-tier1/
          if-no-files-found: error
          retention-days: 30
