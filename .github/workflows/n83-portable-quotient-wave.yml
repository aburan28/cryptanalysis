name: n83 portable quotient wave

on:
  pull_request:
    paths:
      - ".github/workflows/n83-portable-quotient-wave.yml"

permissions:
  contents: read

jobs:
  grouped-wave:
    # The first R29 run has a zero-hit terminal receipt and independent Sage
    # replay. Keep this one-shot wave scoped to its originating PR branch.
    if: github.event.pull_request.head.repo.full_name == 'aburan28/cryptanalysis' && github.event.pull_request.head.ref == 'codex/koblitz-pair-claw-toy'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        query_start:
          - "2147483648"
          - "2684354560"
          - "3221225472"
          - "3758096384"
          - "4294967296"
          - "4831838208"
          - "5368709120"
          - "5905580032"
    uses: ./.github/workflows/n83-portable-quotient-segment.yml
    with:
      query_start: ${{ matrix.query_start }}
      query_reps_log2: "29"
      from_wave: true
