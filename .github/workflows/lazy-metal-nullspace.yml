name: Lazy Metal nullspace construction

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/ci/**"
      - ".github/actions/ci-scope/**"
      - "scripts/ci_scope.py"
      - 'experiments/groebner-perf-20260924/**'
      - 'experiments/pdp-scaling/**'
      - 'experiments/pdp-degree-heuristics/**'
      - '.github/workflows/lazy-metal-nullspace.yml'
  push:
    branches: ["claude/cryptanalysis-repo-setup-p59kek"]
    paths:
      - ".github/ci/**"
      - ".github/actions/ci-scope/**"
      - "scripts/ci_scope.py"
      - 'experiments/groebner-perf-20260924/**'
      - 'experiments/pdp-scaling/**'
      - 'experiments/pdp-degree-heuristics/**'
      - '.github/workflows/lazy-metal-nullspace.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.scope.outputs.selected }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/ci-scope/
            /.github/ci/
            /scripts/ci_scope.py
      - id: scope
        uses: ./.github/actions/ci-scope
        with:
          workflow: lazy-metal-nullspace.yml

  correctness:
    needs: changes
    if: ${{ !cancelled() }}
    name: Lazy Metal nullspace construction (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 25 || 90 }}
    steps:
      - uses: actions/checkout@v7
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        run: python -m pip install numpy==2.4.0
      - name: Build portable dependencies and selected backend
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        shell: bash
        run: |
          mkdir -p lazy-nullspace-evidence
          for version in 20 23 31 32 33 34 35 36 37 38; do
            python "experiments/groebner-perf-20260924/round${version}/build.py" > "lazy-nullspace-evidence/build-${version}.log" 2>&1
          done
          flags=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            flags+=(--metal)
          fi
          python experiments/groebner-perf-20260924/round44/build.py "${flags[@]}" > lazy-nullspace-evidence/build-44.log 2>&1
          python experiments/groebner-perf-20260924/round48/build.py > lazy-nullspace-evidence/build-48.log 2>&1
          python experiments/groebner-perf-20260924/round49/build.py "${flags[@]}" > lazy-nullspace-evidence/build-49.log 2>&1
          python experiments/groebner-perf-20260924/round51/build.py "${flags[@]}" > lazy-nullspace-evidence/build-51.log 2>&1
      - name: Detect actual Metal availability
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false')) && (runner.os == 'macOS')
        working-directory: experiments/groebner-perf-20260924/round51
        run: |
          python - <<'PY'
          import os
          from adapter import producer
          Producer = producer.Producer
          try:
              with Producer(2, 3, 3, backend='metal') as probe:
                  print('METAL_AVAILABLE', probe.device)
          except ValueError as error:
              if str(error) != 'requested Metal device unavailable':
                  raise
              print('METAL_UNAVAILABLE', error)
          else:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('QUADRATIC_TEST_METAL=1\n')
          PY
      - name: Exercise proof semantics and charged failure boundaries
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        run: python -m unittest discover -s experiments/groebner-perf-20260924/round51 -p 'test_*.py' -v > lazy-nullspace-evidence/unit-tests.log 2>&1
      - name: Independently replay GPU row witnesses and affine spaces
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false')) && (env.QUADRATIC_TEST_METAL == '1')
        run: python -u experiments/groebner-perf-20260924/round51/test_projection.py --output lazy-nullspace-evidence/projection-oracle.json > lazy-nullspace-evidence/projection-oracle.log 2>&1
      - name: Validate frozen systems and fresh complete queries
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        shell: bash
        run: |
          flags=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            flags+=(--metal)
          fi
          python -u experiments/groebner-perf-20260924/round51/validate_native.py "${flags[@]}" --output lazy-nullspace-evidence/correctness.json.gz > lazy-nullspace-evidence/validation.log 2>&1
      - name: Independently audit every complete proof from original equations
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        run: python -u experiments/groebner-perf-20260924/round51/audit_queries.py --input lazy-nullspace-evidence/correctness.json.gz --output lazy-nullspace-evidence/independent-audit.json > lazy-nullspace-evidence/independent-audit.log 2>&1
      - name: Retain rebuilt binaries and actual runner identity
        if: ${{ (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false')) && (!cancelled()) }}
        run: |
          python - <<'PY'
          import json, os, pathlib, platform, shutil
          out = pathlib.Path('lazy-nullspace-evidence')
          out.mkdir(exist_ok=True)
          metadata = {k: os.environ.get(k) for k in ('GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_OS', 'RUNNER_ARCH')}
          metadata.update(platform=platform.platform(), architecture=platform.machine())
          (out / 'runner.json').write_text(json.dumps(metadata, indent=2)+'\n')
          for build in pathlib.Path('experiments/groebner-perf-20260924').glob('round*/build'):
              shutil.copytree(build, out / 'native' / build.parent.name, dirs_exist_ok=True)
          kernel = pathlib.Path('experiments/pdp-degree-heuristics/build')
          if kernel.exists():
              shutil.copytree(kernel, out / 'native' / 'pdp-degree-heuristics', dirs_exist_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false')) && (!cancelled()) }}
        with:
          name: lazy-nullspace-${{ matrix.os }}
          path: lazy-nullspace-evidence/
          if-no-files-found: error
          retention-days: 14
