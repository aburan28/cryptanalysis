name: Normalized CPU and Metal proof

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/ci/**"
      - ".github/actions/ci-scope/**"
      - "scripts/ci_scope.py"
      - 'experiments/groebner-perf-20260924/**'
      - 'experiments/pdp-scaling/**'
      - 'experiments/pdp-degree-heuristics/**'
      - '.github/workflows/normalized-wide-certificates.yml'
  push:
    branches: ["claude/cryptanalysis-repo-setup-p59kek"]
    paths:
      - ".github/ci/**"
      - ".github/actions/ci-scope/**"
      - "scripts/ci_scope.py"
      - 'experiments/groebner-perf-20260924/**'
      - 'experiments/pdp-scaling/**'
      - 'experiments/pdp-degree-heuristics/**'
      - '.github/workflows/normalized-wide-certificates.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.scope.outputs.selected }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/ci-scope/
            /.github/ci/
            /scripts/ci_scope.py
      - id: scope
        uses: ./.github/actions/ci-scope
        with:
          workflow: normalized-wide-certificates.yml

  correctness:
    needs: changes
    if: ${{ !cancelled() }}
    name: Normalized proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 25 || 45 }}
    steps:
      - uses: actions/checkout@v7
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        run: python -m pip install numpy==2.4.0
      - name: Build portable native dependencies
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        shell: bash
        run: |
          mkdir -p normalized-proof-evidence
          for version in 20 23 31 32 33 34 35 36 37 38; do
            python "experiments/groebner-perf-20260924/round${version}/build.py" > "normalized-proof-evidence/build-${version}.log" 2>&1
          done
      - name: Build and validate selected backend
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        shell: bash
        run: |
          flags=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            flags+=(--metal)
          fi
          python experiments/groebner-perf-20260924/round42/build.py "${flags[@]}" > normalized-proof-evidence/build-42.log 2>&1
          python -u experiments/groebner-perf-20260924/round42/validate_native.py "${flags[@]}" --output normalized-proof-evidence/correctness.json.gz > normalized-proof-evidence/validation.log 2>&1
      - name: Independently audit every complete-query proof from original ANFs
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        run: python -u experiments/groebner-perf-20260924/round42/audit_queries.py --input normalized-proof-evidence/correctness.json.gz --output normalized-proof-evidence/independent-audit.json > normalized-proof-evidence/independent-audit.log 2>&1
      - name: Retain runner and native build identity
        if: ${{ (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false')) && (!cancelled()) }}
        run: |
          mkdir -p normalized-proof-evidence
          python - <<'PY'
          import json, os, pathlib, shutil
          metadata = {k: os.environ.get(k) for k in ('GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_OS', 'RUNNER_ARCH')}
          pathlib.Path('normalized-proof-evidence/runner.json').write_text(json.dumps(metadata, indent=2)+'\n')
          receipt = pathlib.Path('experiments/groebner-perf-20260924/round42/build/receipt.json')
          if receipt.exists():
              shutil.copy2(receipt, 'normalized-proof-evidence/build-receipt.json')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false')) && (!cancelled()) }}
        with:
          name: normalized-proof-${{ matrix.os }}
          path: normalized-proof-evidence/
          if-no-files-found: error
          retention-days: 14
