name: Sparse F4 column indices

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/ci/**"
      - ".github/actions/ci-scope/**"
      - "scripts/ci_scope.py"
      - 'experiments/groebner-perf-20260924/**'
      - 'experiments/pdp-scaling/**'
      - '.github/workflows/sparse-f4-column-indices.yml'
  push:
    branches: ["claude/cryptanalysis-repo-setup-p59kek"]
    paths:
      - ".github/ci/**"
      - ".github/actions/ci-scope/**"
      - "scripts/ci_scope.py"
      - 'experiments/groebner-perf-20260924/**'
      - 'experiments/pdp-scaling/**'
      - '.github/workflows/sparse-f4-column-indices.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.scope.outputs.selected }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/ci-scope/
            /.github/ci/
            /scripts/ci_scope.py
      - id: scope
        uses: ./.github/actions/ci-scope
        with:
          workflow: sparse-f4-column-indices.yml

  correctness:
    needs: changes
    if: ${{ !cancelled() }}
    name: Sparse F4 column indices (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 25 || 30 }}
    steps:
      - uses: actions/checkout@v7
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        with:
          python-version: '3.12'
      - name: Rebuild, check exact traces, and independently replay certificates
        if: (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false'))
        run: python -u experiments/groebner-perf-20260924/round58/run_validation.py --output column-index-evidence
      - uses: actions/upload-artifact@v4
        if: ${{ (needs.changes.result != 'success' || (toJSON(fromJSON(needs.changes.outputs.selected || '{}').correctness) != 'false')) && (!cancelled()) }}
        with:
          name: sparse-f4-column-indices-${{ matrix.os }}
          path: column-index-evidence/
          if-no-files-found: error
          retention-days: 14
