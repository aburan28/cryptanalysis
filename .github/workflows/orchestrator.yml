name: orchestrator

# The control plane and the agents.  Kept out of ci.yml because it builds a
# different language, and out of bindings.yml because it is not a binding: it
# is a service that runs the library rather than wrapping it.
#
# The library is built first and its `ca` binary handed to the Go tests.  That
# is not a convenience -- several of those tests exist precisely to check that
# the Go implementation of the element hash, the record format and the
# collision solve agrees with the C one, and they skip without a binary to
# compare against.  A job that let them skip would be a job that passes while
# the two halves of the system disagree.

on:
  push:
    branches: ["**"]
    paths:
      - "orchestrator/**"
      - "src/dist.c"
      - "include/cryptanalysis/ca_dist.h"
      - "tools/ca_cli.c"
      - ".github/workflows/orchestrator.yml"
  pull_request:
    paths:
      - "orchestrator/**"
      - "src/dist.c"
      - "include/cryptanalysis/ca_dist.h"
      - "tools/ca_cli.c"
      - ".github/workflows/orchestrator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  go:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          # No module cache: the orchestrator has no third-party
          # dependencies, so there is nothing to cache and a cache miss
          # cannot slow anything down.
          cache: false

      - name: Build the library and its CLI
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCA_WERROR=ON
          cmake --build build -j"$(getconf _NPROCESSORS_ONLN)"
          ./build/ca version

      - name: The distributed protocol's own tests
        run: ctest --test-dir build --output-on-failure -R dist

      - name: Vet and format
        working-directory: orchestrator
        run: |
          go vet ./...
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi

      - name: Confirm there are no third-party dependencies
        working-directory: orchestrator
        # The deployment story rests on this: a static binary with nothing but
        # the standard library builds on an air-gapped runner and needs no
        # vendor directory, no proxy and no supply-chain review per release.
        run: |
          if [ -f go.sum ]; then
            echo "go.sum exists, so a dependency was added; that is a decision, not an accident" >&2
            exit 1
          fi
          GOFLAGS=-mod=mod GOPROXY=off go build ./...

      - name: Test
        working-directory: orchestrator
        env:
          CA_BIN: ${{ github.workspace }}/build/ca
        run: go test -race -count=1 ./...

      - name: Build the release binaries
        working-directory: orchestrator
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" -o ../build/ca-control ./cmd/ca-control
          go build -trimpath -ldflags "-s -w" -o ../build/ca-agent ./cmd/ca-agent
          ../build/ca-control version

      - name: Smoke test the fleet end to end
        # One control plane, two agents, one small instance, and a real
        # answer: the same path a production deployment takes, minus the
        # scheduler that starts the processes.
        run: orchestrator/scripts/smoke.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-logs
          path: /tmp/ca-smoke/*.log
          if-no-files-found: ignore
