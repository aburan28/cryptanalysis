name: n83 Q1081 conditional zero-run M32 wave

on:
  pull_request:
    paths:
      - ".github/workflows/n83-q1081-zero-run-m32-wave.yml"

permissions:
  contents: read

jobs:
  physical-x86-m32-wave:
    # Q1081 was dispatched from the frozen plan in run 36801654799.
    # Keep later PR synchronizations from repeating these intervals.
    if: false
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        query_start:
          - "22548578304"
          - "23085449216"
          - "23622320128"
          - "24159191040"
          - "24696061952"
          - "25232932864"
          - "25769803776"
          - "26306674688"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      QUERY_START: ${{ matrix.query_start }}
    steps:
      - uses: actions/checkout@v4

      - name: Freeze exact instance, sources, and host resources
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, shutil, subprocess
          root = pathlib.Path('experiments/koblitz-pair-claw-20260929')
          plan_path = root / 'n83_q1081_m32_wave_plan.json'
          screen_path = root / 'n83_full_spill_screen.json'
          workflow_path = pathlib.Path('.github/workflows/n83-q1081-zero-run-m32-wave.yml')
          plan = json.loads(plan_path.read_text())
          screen = json.loads(screen_path.read_text())
          start = int(os.environ['QUERY_START'])
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          assert plan['proposal_id'] == 'Q1079' and plan['status'] == 'ready_for_dispatch'
          assert plan['wave_proposal_id'] == 'Q1081'
          assert plan['executable_proposal_id'] == 'Q1079'
          assert plan['candidate_id'] is None and plan['run_id'] is None
          assert plan['curve_id'] == screen['curve_id'] == 'EC1N83Ckb1h876c2921cb64'
          assert plan['isogeny'] == screen['isogeny'] == 'none'
          assert plan['factor_base_enumerated_set_sha256'] == screen['factor_base']['enumerated_set_sha256']
          assert plan['actual_usable_points_B_before_folding'] == 8000204
          assert plan['signed_frobenius_columns'] == 48194
          assert plan['public_target'] == screen['public_target']
          assert start in plan['query_starts'] and len(plan['query_starts']) == 8
          assert plan['query_starts'] == [22548578304 + i * (1 << 29) for i in range(8)]
          assert plan['table_start'] == 0 and plan['table_descriptors'] == 1 << 32
          assert plan['query_representatives'] == 1 << 29
          assert plan['query_end_exclusive'] == 26843545600
          assert plan['cpu_backend'] == 'x86_pclmul'
          assert plan['workers'] == 4 and plan['representative_batch'] == 8
          assert plan['bits_per_key'] == 20 and plan['hashes'] == 10
          for key, path in (
              ('screen_sha256', screen_path),
              ('Q1081_design_sha256', root / 'n83_m32_wave_q1081_design.json'),
              ('prior_Q1079_plan_sha256', root / 'n83_q1079_m32_wave_plan.json'),
              ('coverage_ledger_sha256', root / 'n83_full_spill_segment_work.json'),
              ('source_sha256', root / 'n83_q1081_full_plan.py'),
              ('runner_source_sha256', root / 'run_n83_zero_run_chunk.py'),
              ('source_generator_sha256', root / 'bench_n83_zero_run_stage.py'),
              ('portable_native_source_sha256', root / 'native_n83_orbit_query_spill_portable.cpp'),
              ('portable_core_source_sha256', root / 'native_n83_bloom_core_portable.hpp'),
              ('portable_pairs_source_sha256', root / 'native_n83_pairs_portable.cpp'),
              ('generated_field_sha256', pathlib.Path('ecc2k130/runner/generated/eccF83.h')),
          ):
              assert plan[key] == sha(path), key
          q1074 = plan['Q1074_state']
          assert q1074['plan_sha256'] == sha(root / 'n83_local_arm_m33_r30_q1074_plan.json')
          assert not q1074['completed_coverage_credited_here']
          assert q1074['query_end_exclusive'] <= min(plan['query_starts'])
          assert q1074['status'] in ('active_uncredited','completed_zero_audited')
          if q1074['status'] == 'completed_zero_audited':
              terminal = q1074['terminal_audit']
              assert terminal['receipt_sha256'] == sha(root / terminal['receipt'])
              assert terminal['sage_audit_sha256'] == sha(root / terminal['sage_audit'])
          assert len(plan['terminal_prior_Q1079_audits']) == 8
          for item in plan['terminal_prior_Q1079_audits']:
              assert item['receipt_sha256'] == sha(root / item['receipt'])
              assert item['sage_audit_sha256'] == sha(root / item['sage_audit'])
              assert item['bundle_sha256'] == sha(root / item['bundle'])
          assert platform.machine().lower() in ('x86_64', 'amd64')
          cpu = pathlib.Path('/proc/cpuinfo').read_text().lower()
          assert 'pclmulqdq' in cpu or 'pclmul' in cpu
          memory = {line.split(':', 1)[0]: int(line.split(':', 1)[1].split()[0]) * 1024
                    for line in pathlib.Path('/proc/meminfo').read_text().splitlines()
                    if ':' in line}
          root_free = shutil.disk_usage('/').free
          dest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'n83-q1081-m32'
          dest.mkdir()
          for name in ('control-sources','full-sources','control-spill','full-spill'):
              (dest / name).mkdir()
          report = {
              'kind':'n83_q1081_M32_R29_physical_x86_preflight',
              'proposal_id':'Q1081','executable_proposal_id':'Q1079',
              'candidate_id':None,'run_id':None,
              'curve_id':plan['curve_id'],'isogeny':'none',
              'factor_base_enumerated_set_sha256':plan['factor_base_enumerated_set_sha256'],
              'actual_usable_points_B_before_folding':8000204,
              'signed_frobenius_columns':48194,
              'table_start':0,'table_descriptors':1 << 32,
              'query_start':start,'query_representatives':1 << 29,
              'architecture':platform.machine(),'platform':platform.platform(),
              'cpu_model':next((line.split(':',1)[1].strip() for line in
                                pathlib.Path('/proc/cpuinfo').read_text().splitlines()
                                if line.startswith('model name')),None),
              'compiler':subprocess.run(['clang++','--version'],check=True,
                                        capture_output=True,text=True).stdout.splitlines()[0],
              'mem_total_bytes':memory['MemTotal'],
              'mem_available_bytes':memory['MemAvailable'],
              'root_free_bytes':root_free,
              'minimum_mem_available_bytes':plan['minimum_mem_available_bytes'],
              'minimum_root_free_bytes':plan['minimum_root_free_bytes'],
              'plan_sha256':sha(plan_path),
              'Q1074_state_at_plan_freeze':q1074['status'],
              'workflow_sha256':sha(workflow_path),
          }
          (dest / 'host.json').write_text(json.dumps(report,indent=2)+'\n')
          assert memory['MemAvailable'] >= plan['minimum_mem_available_bytes']
          assert root_free >= plan['minimum_root_free_bytes']
          print(json.dumps(report))
          PY

      - name: Same-host bounded exact control
        run: |
          python3 experiments/koblitz-pair-claw-20260929/run_n83_zero_run_chunk.py \
            --cpu-backend x86_pclmul --cxx clang++ \
            --spill-dir "$RUNNER_TEMP/n83-q1081-m32/control-spill" \
            --source-dir "$RUNNER_TEMP/n83-q1081-m32/control-sources" \
            --binary "$RUNNER_TEMP/n83-q1081-m32/control-bin" \
            --table-log2 20 --query-reps-log2 14 \
            --table-start 0 --query-start "$QUERY_START" \
            --workers 4 --rep-batch 8 --bits-per-key 20 --hashes 10 \
            --out "$RUNNER_TEMP/n83-q1081-m32/control.json"

      - name: Full M32 public-target search
        run: |
          python3 experiments/koblitz-pair-claw-20260929/run_n83_zero_run_chunk.py \
            --cpu-backend x86_pclmul --cxx clang++ \
            --spill-dir "$RUNNER_TEMP/n83-q1081-m32/full-spill" \
            --source-dir "$RUNNER_TEMP/n83-q1081-m32/full-sources" \
            --frozen-plan experiments/koblitz-pair-claw-20260929/n83_q1081_m32_wave_plan.json \
            --binary "$RUNNER_TEMP/n83-q1081-m32/full-bin" \
            --table-log2 32 --query-reps-log2 29 \
            --table-start 0 --query-start "$QUERY_START" \
            --workers 4 --rep-batch 8 --bits-per-key 20 --hashes 10 \
            --out "$RUNNER_TEMP/n83-q1081-m32/full.json"

      - name: Check terminal receipt
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'n83-q1081-m32'
          host=json.loads((root/'host.json').read_text())
          control=json.loads((root/'control.json').read_text())
          full=json.loads((root/'full.json').read_text())
          assert host['proposal_id']=='Q1081' and host['executable_proposal_id']=='Q1079'
          assert control['proposal_id']==full['proposal_id']=='Q1079'
          assert control['curve_id']==full['curve_id']==host['curve_id']
          assert control['factor_base']==full['factor_base']
          assert full['factor_base']['enumerated_set_sha256']==host['factor_base_enumerated_set_sha256']
          assert full['isogeny']=='none' and full['candidate_id'] is None and full['run_id'] is None
          assert control['public_target']==full['public_target']
          assert full['table_descriptors']==1<<32 and full['query_representatives']==1<<29
          assert full['query_start']==int(os.environ['QUERY_START'])
          assert full['keyer_variant']=='exact_longest_zero_run'
          assert full['native_result']['candidate_store_mode']=='unlinked_file'
          assert full['native_result']['peak_rss_bytes']>=full['native_result']['bloom_bytes']
          if full['native_result']['exact_hit_queries']:
              assert full['verified_public_target_quotient_table_dlp'], 'exact hit needs review'
          print(json.dumps({'exact_hit_queries':full['native_result']['exact_hit_queries'],
                            'verified_dlp':full['verified_public_target_quotient_table_dlp'],
                            'target_online_seconds':full['target_online_seconds']}))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n83-q1081-M32-R29-start-${{ matrix.query_start }}
          path: ${{ runner.temp }}/n83-q1081-m32/
          retention-days: 7
