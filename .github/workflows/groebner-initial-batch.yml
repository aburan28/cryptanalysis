name: Groebner certified F4 initial batching
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  exact:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CXX: clang++
      GROEBNER_PHASE_REFERENCE_ROOT: ${{ github.workspace }}
      GROEBNER_F4_REFERENCE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and independently audit the frozen reference
        run: python experiments/groebner-perf-20260924/round112/run_validation.py --output f4-initial-batch-evidence/reference
      - name: Build the matched ordered and batched native engines
        run: |
          python experiments/groebner-perf-20260924/round113/build.py --reference-root "$GITHUB_WORKSPACE"
          python experiments/groebner-perf-20260924/round115/build.py --reference-root "$GITHUB_WORKSPACE"
          python experiments/groebner-perf-20260924/round116/build.py --reference-root "$GITHUB_WORKSPACE"
      - name: Profile deterministic work and replay the batched proofs
        run: |
          python experiments/groebner-perf-20260924/round115/profile.py --reference-root "$GITHUB_WORKSPACE" --reference-report f4-initial-batch-evidence/reference/panel/report.json --output f4-initial-batch-evidence/inner --reps 3
          python experiments/groebner-perf-20260924/round116/panel.py --reference-report f4-initial-batch-evidence/reference/panel/report.json --output f4-initial-batch-evidence/batched
          python experiments/groebner-perf-20260924/round116/profile.py --reference-root "$GITHUB_WORKSPACE" --reference-report f4-initial-batch-evidence/reference/panel/report.json --output f4-initial-batch-evidence/paired --reps 3
          python experiments/groebner-perf-20260924/round116/test_large.py --output f4-initial-batch-evidence/large-proof.json
      - name: Retain exact results and failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groebner-initial-batch-${{ matrix.os }}
          path: f4-initial-batch-evidence
          if-no-files-found: error
