name: Algorithm request or performance report
description: A new algorithm, or a constant that should be better than it is.
labels: ["algorithm"]
body:
  - type: textarea
    id: what
    attributes:
      label: The algorithm or the measurement
      description: >
        For a new algorithm, name it and cite the paper.  For a performance
        report, give the measured constant and the one you expected.  The unit
        is S = group operations / sqrt(N); `ca_bench generic` prints it.
    validations:
      required: true

  - type: textarea
    id: numbers
    attributes:
      label: Numbers
      description: Paste the relevant ca_bench rows.
      render: text

  - type: input
    id: reference
    attributes:
      label: Reference
      placeholder: "Bernstein & Lange, Two grumpy giants and a baby, ANTS X (2012)"
