version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      # One pull request for the routine action bumps; a major bump still
      # comes on its own so it gets read.
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /bindings/rust
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /bindings/go
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /bindings/python
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
