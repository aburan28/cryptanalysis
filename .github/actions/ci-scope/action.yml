name: Select affected CI jobs
description: Use the complete local Git diff; unavailable diffs run every job.
inputs:
  workflow:
    description: Workflow filename in .github/ci/scopes.json
    required: true
outputs:
  selected:
    description: JSON object mapping job IDs to boolean selections
    value: ${{ steps.scope.outputs.selected }}
runs:
  using: composite
  steps:
    - id: scope
      shell: bash
      env:
        CI_SCOPE_WORKFLOW: ${{ inputs.workflow }}
      run: python3 scripts/ci_scope.py --workflow "$CI_SCOPE_WORKFLOW"
