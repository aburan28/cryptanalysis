{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cryptanalysis-operator.fullname" . }}
  labels:
    {{- include "cryptanalysis-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cryptanalysis-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  ingress:
    {{- if and .Values.metrics.enabled .Values.networkPolicy.metricsIngress }}
    - ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
      from:
        {{- toYaml .Values.networkPolicy.metricsIngress | nindent 8 }}
    {{- else }}
    []
    {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
