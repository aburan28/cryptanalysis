# Defining a campaign is a one-shot Job rather than a field in the control
# plane's spec.
#
# A campaign is immutable once it exists and its seed must never change, so
# it does not belong in a manifest that a rolling update re-applies: an
# operator who edited the group parameters in a ConfigMap would be starting a
# second search whose corpus cannot merge with the first, and nothing would
# report an error.  A Job makes that a deliberate, once, auditable act.
apiVersion: batch/v1
kind: Job
metadata:
  name: ca-campaign-create
  namespace: cryptanalysis
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: create
          image: ghcr.io/aburan28/cryptanalysis:latest
          command: ["/usr/local/bin/ca-control", "create"]
          args:
            - --server=http://ca-control.cryptanalysis.svc:8080
            - --name=demo
            - --group=zp
            - --p=2000000579
            - --order=1000000289
            # Base and target for the instance being attacked.  Generate them
            # with `ca gen`, and keep the answer out of the cluster: the
            # whole point is for the fleet to find it.
            - --g=1104908998
            - --h=1324967879
            # Leave --seed unset: the control plane draws one from the
            # operating system.  A seed pinned in a manifest is a seed two
            # clusters can share, and two campaigns that share a seed produce
            # corpora that merge into each other and solve neither instance.
          env:
            - {name: CA_TOKEN_FILE, value: /etc/ca/token}
          volumeMounts:
            - {name: token, mountPath: /etc/ca, readOnly: true}
      volumes:
        - name: token
          secret: {secretName: ca-token, items: [{key: token, path: token}]}
