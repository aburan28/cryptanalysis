# Agents talk to the control plane and to nothing else; the control plane
# accepts from agents and from the monitoring namespace.
#
# Worth having even in a trusted cluster: the control plane's authentication
# is a single bearer token shared by every agent, so the blast radius of that
# token leaking is bounded by what can reach the port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ca-control
  namespace: cryptanalysis
spec:
  podSelector:
    matchLabels: {app: ca-control}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: ca-agent}
      ports:
        - {protocol: TCP, port: 8080}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ca-agent
  namespace: cryptanalysis
spec:
  podSelector:
    matchLabels: {app: ca-agent}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: ca-control}
      ports:
        - {protocol: TCP, port: 8080}
    # DNS, without which the Service name above does not resolve.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
