# The control plane: one replica, one volume.
#
# A StatefulSet rather than a Deployment, and one replica rather than three,
# because the corpus and the lease table live in this process's memory and on
# its disk.  Two replicas behind one Service would hand the same unit to two
# agents from two different lease tables and would each hold half the corpus,
# so the collision that solves the campaign might never be in one place.
# Making it horizontally scalable means moving the corpus into a shared store,
# which is a real design and not this one.
#
# That is affordable because the control plane is not on the hot path: agents
# walk for minutes per unit and talk to it for milliseconds.  A restart costs
# the fleet one lease period, and the corpus survives in the volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ca-control
  namespace: cryptanalysis
spec:
  serviceName: ca-control
  replicas: 1
  selector:
    matchLabels: {app: ca-control}
  template:
    metadata:
      labels: {app: ca-control}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # Long enough for the drain-then-shutdown sequence in main.go to finish
      # in-flight uploads; an upload killed half way is re-sent, but a whole
      # fleet re-sending at once is a stampede worth not causing.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: control
          image: ghcr.io/aburan28/cryptanalysis:latest
          args: ["serve"]
          env:
            - {name: CA_LISTEN, value: ":8080"}
            - {name: CA_STATE, value: /var/lib/ca-control}
            - {name: CA_TOKEN_FILE, value: /etc/ca/token}
            - {name: CA_LEASE_TTL, value: "90s"}
            - {name: CA_HEARTBEAT, value: "30s"}
            - {name: CA_LOG_LEVEL, value: info}
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - {name: state, mountPath: /var/lib/ca-control}
            - {name: token, mountPath: /etc/ca, readOnly: true}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            # /readyz fails while draining, which takes this pod out of the
            # Service before it stops handing out leases.
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            # Restoring a large corpus re-verifies every point, so a cold
            # start can take a while; the startup probe is what stops the
            # liveness probe from killing it half way through.
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 120
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: token
          secret: {secretName: ca-token, items: [{key: token, path: token}]}
  volumeClaimTemplates:
    - metadata: {name: state}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # The corpus is the only thing that grows: about 32 bytes per
            # distinguished point, and a campaign is sized for roughly a
            # million of them, so this is two orders of magnitude of headroom.
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ca-control
  namespace: cryptanalysis
spec:
  selector: {app: ca-control}
  ports:
    - {name: http, port: 8080, targetPort: http}
