# The agents: a Deployment, because they are interchangeable and stateless.
#
# Everything about this spec follows from one property of the work: a unit in
# flight is disposable.  Agents can be preempted, rescheduled, scaled to zero
# and back, and the only cost is the walk steps in flight -- the unit goes
# back in the queue and anyone can redo it, because a unit is replayable from
# its id.  That is what makes spot and preemptible capacity the right place
# to run them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ca-agent
  namespace: cryptanalysis
spec:
  replicas: 4
  selector:
    matchLabels: {app: ca-agent}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 25%, maxUnavailable: 50%}
  template:
    metadata:
      labels: {app: ca-agent}
    spec:
      # SIGTERM stops the walk, uploads the points already produced and hands
      # the unit back.  30s is enough for that upload; beyond it the unit
      # simply expires and is re-issued, which is not an incident.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      # Spread across nodes so that losing one node does not lose the fleet.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: ca-agent}
      containers:
        - name: agent
          image: ghcr.io/aburan28/cryptanalysis:latest
          command: ["/usr/local/bin/ca-agent"]
          env:
            - {name: CA_SERVER, value: "http://ca-control.cryptanalysis.svc:8080"}
            - {name: CA_TOKEN_FILE, value: /etc/ca/token}
            - {name: CA_BIN, value: /usr/local/bin/ca}
            - {name: CA_TMPDIR, value: /scratch}
            - {name: CA_HEALTH_LISTEN, value: ":8081"}
            - {name: CA_LOG_LEVEL, value: info}
            # The agent id must be stable for as long as the pod is, and
            # unique across the fleet; the pod name is both.
            - name: CA_AGENT_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: CA_LABELS
              value: "runtime=kubernetes"
          ports:
            - {name: probe, containerPort: 8081}
          volumeMounts:
            - {name: token, mountPath: /etc/ca, readOnly: true}
            # Unit output is written here and uploaded; it is worthless
            # afterwards and must not survive the pod, which is exactly what
            # an emptyDir is.
            - {name: scratch, mountPath: /scratch}
          livenessProbe:
            httpGet: {path: /healthz, port: probe}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: probe}
            periodSeconds: 10
          resources:
            # One walk per core: the library's walker is CPU-bound and the
            # limit is what decides how fast a unit finishes.  Raise both
            # together; a CPU limit below the request is how a fleet ends up
            # throttled and looking idle.
            requests: {cpu: "1", memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: token
          secret: {secretName: ca-token, items: [{key: token, path: token}]}
        - name: scratch
          emptyDir: {sizeLimit: 1Gi}
---
# Scaling the fleet is scaling the replica count; there is no autoscaler here
# on purpose.  An HPA scales on a signal, and the signal that matters -- "is
# there work" -- is binary: the campaign has units until it is solved.  A
# KEDA ScaledObject on ca_campaign_units_pending is the honest way to do it
# when a cluster already runs KEDA; a CPU-based HPA would just observe that
# the agents are always busy, which they are by construction.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ca-agent
  namespace: cryptanalysis
spec:
  # Agents are disposable, so this is deliberately permissive: it exists to
  # stop a drain taking every agent at once, not to protect any one of them.
  maxUnavailable: 50%
  selector:
    matchLabels: {app: ca-agent}
