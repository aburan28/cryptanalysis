# The shared bearer token.  Agents and the control plane read it from a file
# rather than an environment variable: an env var is visible in `kubectl
# describe pod` and in every crash dump, a mounted file is not.
#
# Create it for real with:
#   kubectl -n cryptanalysis create secret generic ca-token \
#       --from-literal=token="$(head -c 32 /dev/urandom | base64)"
# This manifest exists so that `kubectl apply -k` works out of the box in a
# throwaway cluster; the value is not a secret and must be replaced.
apiVersion: v1
kind: Secret
metadata:
  name: ca-token
  namespace: cryptanalysis
type: Opaque
stringData:
  token: "replace-me-before-any-real-deployment"
