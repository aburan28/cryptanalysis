# TLS in front of the hub.  The coordinator speaks plain HTTP by design;
# this is what gives agents an https:// URL.
#
# The two directives that matter are the upgrade ones: the reverse
# channel is an HTTP/1.1 upgrade, and a proxy that does not pass
# `Upgrade`/`Connection` through turns it into a 426 and the fleet falls
# back to nothing.  For the same reason the read timeout must exceed the
# hub's keepalive, or nginx closes idle channels and every agent
# reconnects on a timer.
server {
    listen 443 ssl;
    http2 on;
    server_name rho.example.com;

    ssl_certificate     /etc/letsencrypt/live/rho.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rho.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;

        # The reverse channel.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A channel is idle whenever no distinguished point has turned up
        # recently, so stay generously above the hub's ping period
        # (idle_secs / 3, i.e. 100 s at the default).
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        proxy_buffering     off;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A /v1/sync body is the largest thing on the wire.
    client_max_body_size 8m;
}

# In http{}:
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
