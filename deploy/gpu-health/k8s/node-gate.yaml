# Gate new GPU nodes on the health check: nothing schedules onto a node until
# its GPUs have passed.
#
# 1. Register GPU nodes with the gate taint (the node group's or NodePool's
#    taints, or kubelet --register-with-taints):
#
#        gpu-health/pending=true:NoSchedule
#
# 2. Apply this file.  The DaemonSet tolerates the taint, so on a new node it
#    runs before anything else.  Its init container loads every GPU of the node
#    for GPU_HEALTH_SECONDS and checks them:
#
#      pass  label gpu-health/verdict=pass and lift the taint: the node takes work
#      fail  label gpu-health/verdict=fail, keep the taint, exit 1.  The kubelet
#            retries with backoff (at most five minutes apart), so a node that
#            recovers is released and one that does not stays out of service.
#
#    The verdict line is on the node and in the pod's termination message:
#
#        kubectl get nodes -L gpu-health/verdict
#        kubectl get node NODE -o jsonpath='{.metadata.annotations.gpu-health/verdict}'
#
#    A node without the taint is never loaded again, so a DaemonSet rollout
#    does not disturb nodes that are running work.  To re-check one, drain it,
#    taint it and delete its gpu-health pod.
#
# GPU access: the check runs on every GPU of the node without requesting
# nvidia.com/gpu.  A pod that requested them would hold them for as long as it
# ran, and this pod stays (a pause container keeps the verdict in place).  So,
# like the NVIDIA GPU Operator's own validator, it asks the NVIDIA container
# runtime for NVIDIA_VISIBLE_DEVICES=all.  That needs the runtime to be the
# node's default or named by runtimeClassName (below), and to accept the
# variable from an unprivileged container, which is the NVIDIA Container
# Toolkit's default (accept-nvidia-visible-devices-envvar-when-unprivileged).
# If your toolkit refuses it, make the init container privileged.
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-health
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-health
  namespace: gpu-health
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-health-node-gate
rules:
  # Read the node's taints; label, annotate and lift the gate taint.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-health-node-gate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-health-node-gate
subjects:
  - kind: ServiceAccount
    name: gpu-health
    namespace: gpu-health
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-health
  namespace: gpu-health
spec:
  selector:
    matchLabels:
      app: gpu-health
  template:
    metadata:
      labels:
        app: gpu-health
    spec:
      serviceAccountName: gpu-health
      runtimeClassName: nvidia  # drop if the NVIDIA runtime is the node's default
      # The label NVIDIA's GPU feature discovery puts on GPU nodes; use your own.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: gpu-health/pending
          operator: Exists
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: gpu-health
          image: ghcr.io/aburan28/gpu-health:latest  # pin a digest in production
          env:
            - name: GPU_HEALTH_NODE_GATE
              value: "1"
            # A new node gets a longer soak than a pod's init container would.
            - name: GPU_HEALTH_SECONDS
              value: "120"
            # The GPUs every node of this pool must have (0: any).
            - name: GPU_HEALTH_EXPECT_GPUS
              value: "8"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # Small requests, because an init container's requests count toward
          # the pod's for as long as the pod exists; no CPU limit, so the check
          # can use the idle cores of a node that is not yet taking work
          # (it wants about one per GPU).
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 16Gi
          terminationMessagePolicy: FallbackToLogsOnError
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              memory: 16Mi
