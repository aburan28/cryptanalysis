{{- if .Values.agents.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ca-coordinator.suffixed" (list . "agent") }}
  labels:
    {{- include "ca-coordinator.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: {{ .Values.agents.replicaCount }}
  selector:
    matchLabels:
      {{- include "ca-coordinator.agentSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ca-coordinator.labels" . | nindent 8 }}
        app.kubernetes.io/component: agent
      annotations:
        checksum/job: {{ toYaml .Values.job | sha256sum }}
        {{- with .Values.agents.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ca-coordinator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.agents.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: agent
          image: {{ include "ca-coordinator.agentImage" . | quote }}
          imagePullPolicy: {{ .Values.agents.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - work
            # Lanes check in as <node>.<lane>, so every pod needs a name
            # no other pod uses; the pod's own name is already that.
            - --node
            - $(POD_NAME)
            - --threads
            - {{ .Values.agents.threads | quote }}
            - --checkin-every
            - {{ .Values.agents.checkinEvery | quote }}
            {{- if .Values.agents.idleWhenSolved }}
            - --idle-when-solved
            {{- end }}
            {{- with .Values.agents.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The URL is the agent's whole configuration: it fetches the
            # job document from the coordinator, so nothing else here
            # has to know what is being solved.
            - name: CA_COORDINATOR_URL
              value: {{ include "ca-coordinator.internalURL" . | quote }}
            {{- if include "ca-coordinator.hasToken" . }}
            - name: CA_COORDINATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ca-coordinator.tokenSecret" . }}
                  key: {{ .Values.auth.key }}
            {{- end }}
          resources:
            {{- toYaml .Values.agents.resources | nindent 12 }}
          # No ports, no probes: an agent opens every connection it uses
          # and listens on nothing, so there is nothing to probe and
          # nothing for a NetworkPolicy to allow inbound.
          volumeMounts:
            - name: work
              mountPath: /var/lib/ca
      volumes:
        # readOnlyRootFilesystem is on, and the agent wants a working
        # directory; it keeps nothing across restarts, so emptyDir is
        # the honest choice.
        - name: work
          emptyDir: {}
      # A pod that goes away mid-unit costs the unfinished part of that
      # unit: its lease expires and another agent resumes from the last
      # reported cursor.  That is why spot capacity is fine here.
      terminationGracePeriodSeconds: 15
      {{- with .Values.agents.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agents.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agents.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
