{{- if and .Values.auth.token (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ca-coordinator.fullname" . }}-token
  labels:
    {{- include "ca-coordinator.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Access control, not integrity: every record on the wire is verified
  # against the group whoever sent it.
  {{ .Values.auth.key }}: {{ .Values.auth.token | quote }}
{{- end }}
