{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ca-coordinator.serviceAccountName" . }}
  labels:
    {{- include "ca-coordinator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Neither the coordinator nor an agent talks to the API server.
automountServiceAccountToken: false
{{- end }}
