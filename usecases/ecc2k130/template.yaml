AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Event-driven ECC2K-130 S3 commit index

Parameters:
  CampaignBucket:
    Type: String
    Default: ecc2k130-590183823895
  StatusBucket:
    Type: String
    Default: ecc2k130-status-590183823895
  CampaignId:
    Type: String
    Default: ""
    Description: SHA-256 campaign contract id; empty accepts the legacy live campaign
  RdsHost:
    Type: String
  RdsSecretName:
    Type: String
    Default: rho/dp-rds
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>

Resources:
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  IngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 960
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 8

  IngestQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref IngestQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CampaignBucketCommitMarkers
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt IngestQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:s3:::${CampaignBucket}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  IndexFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handler.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      MemorySize: 4096
      Timeout: 900
      ReservedConcurrentExecutions: 6
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      Environment:
        Variables:
          RHO_CAMPAIGN: ecc2k-130
          ECC2K130_CAMPAIGN_ID: !Ref CampaignId
          ECC_BUCKET: !Ref CampaignBucket
          ECC_STATUS_BUCKET: !Ref StatusBucket
          ECC_INGEST_QUEUE_URL: !Ref IngestQueue
          RHO_DB_HOST: !Ref RdsHost
          RHO_DB_SECRET: !Ref RdsSecretName
          RHO_DB_SSLMODE: require
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::${CampaignBucket}/dp/*
                - !Sub arn:${AWS::Partition}:s3:::${CampaignBucket}/ckpt/*
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${StatusBucket}/status.json
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub >-
                arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${RdsSecretName}*
            - Effect: Allow
              Action:
                - sqs:GetQueueAttributes
              Resource: !GetAtt IngestQueue.Arn
      Events:
        Commits:
          Type: SQS
          Properties:
            Queue: !GetAtt IngestQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
        Status:
          Type: Schedule
          Properties:
            Schedule: rate(3 minutes)
            Input: '{"action":"publish-status"}'

Outputs:
  QueueArn:
    Value: !GetAtt IngestQueue.Arn
  QueueUrl:
    Value: !Ref IngestQueue
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  FunctionName:
    Value: !Ref IndexFunction
