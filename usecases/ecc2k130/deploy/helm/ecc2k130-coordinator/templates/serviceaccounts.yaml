{{- range $component := list "publisher" "consumer" "reconciler" }}
{{- $account := index $.Values.serviceAccounts $component }}
{{- if $account.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ecc2k130-coordinator.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "ecc2k130-coordinator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $account.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $account.automountServiceAccountToken }}
{{- end }}
{{- end }}
