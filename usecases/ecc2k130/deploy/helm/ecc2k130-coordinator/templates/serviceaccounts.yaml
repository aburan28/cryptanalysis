{{- range $component := list "publisher" "consumer" "reconciler" }}
{{- $account := index $.Values.serviceAccounts $component }}
{{- if and $account.create (include "ecc2k130-coordinator.componentEnabled" (dict "root" $ "component" $component)) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ecc2k130-coordinator.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "ecc2k130-coordinator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- $annotations := include "ecc2k130-coordinator.serviceAccountAnnotations" (dict "root" $ "component" $component) }}
  {{- if ne $annotations "{}" }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $account.automountServiceAccountToken }}
{{- end }}
{{- end }}
