{{- $kind := .Values.publisher.kind -}}
apiVersion: apps/v1
kind: {{ $kind }}
metadata:
  name: {{ include "ecc2k130-coordinator.fullname" . }}-publisher
  labels:
    {{- include "ecc2k130-coordinator.labels" . | nindent 4 }}
    app.kubernetes.io/component: publisher
spec:
  {{- if eq $kind "Deployment" }}
  replicas: {{ .Values.publisher.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- else }}
  updateStrategy:
    {{- toYaml .Values.publisher.daemonSet.updateStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ecc2k130-coordinator.selectorLabels" (dict "root" . "component" "publisher") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ecc2k130-coordinator.selectorLabels" (dict "root" . "component" "publisher") | nindent 8 }}
        {{- with .Values.publisher.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/external-config: {{ printf "%s|%s|%s" .Values.rolloutNonce (toJson .Values.existingSecret) (include "ecc2k130-coordinator.serviceAccountAnnotations" (dict "root" . "component" "publisher")) | sha256sum }}
        {{- with .Values.publisher.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ecc2k130-coordinator.serviceAccountName" (dict "root" . "component" "publisher") }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.publisher.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.publisher.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: publisher
          image: {{ include "ecc2k130-coordinator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "publish_api.py"]
          ports:
            - name: http
              containerPort: {{ .Values.publisher.port }}
              {{- if gt (int .Values.publisher.hostPort) 0 }}
              hostPort: {{ .Values.publisher.hostPort }}
              {{- end }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ecc2k130-coordinator.fullname" . }}
          env:
            {{- include "ecc2k130-coordinator.producerQueueSecretEnv" . | nindent 12 }}
            - name: RHO_QUEUE_PUBLISH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecc2k130-coordinator.secretName" . }}
                  key: {{ required "existingSecret.publishTokenKey is required" .Values.existingSecret.publishTokenKey }}
            {{- include "ecc2k130-coordinator.identityEnv" (dict "root" . "component" "publisher") | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.publisher.resources | nindent 12 }}
          {{- with (include "ecc2k130-coordinator.identityVolumeMount" .) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
      {{- with (include "ecc2k130-coordinator.identityVolume" .) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "ecc2k130-coordinator.nodeSelector" (dict "root" . "component" "publisher")) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.publisher.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.publisher.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $kind "Deployment" }}
      {{- with .Values.publisher.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
