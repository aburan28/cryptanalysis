{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ecc2k130-coordinator.fullname" . }}-deny-ingress
  labels:
    {{- include "ecc2k130-coordinator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ecc2k130-coordinator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  ingress: []
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ecc2k130-coordinator.fullname" . }}-publisher
  labels:
    {{- include "ecc2k130-coordinator.labels" . | nindent 4 }}
    app.kubernetes.io/component: publisher
spec:
  podSelector:
    matchLabels:
      {{- include "ecc2k130-coordinator.selectorLabels" (dict "root" . "component" "publisher") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.publisher.port }}
          protocol: TCP
      {{- if or .Values.networkPolicy.allowSameNamespace .Values.networkPolicy.publisherClientPodSelector .Values.networkPolicy.additionalPublisherIngress }}
      from:
        {{- if .Values.networkPolicy.allowSameNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
        {{- end }}
        {{- with .Values.networkPolicy.publisherClientPodSelector }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.networkPolicy.additionalPublisherIngress }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      from: []
      {{- end }}
{{- end }}
