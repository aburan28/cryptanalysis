{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ecc2k130-coordinator.fullname" . }}-test
  labels:
    {{- include "ecc2k130-coordinator.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
    cryptanalysis.io/ecc2k130-publisher-client: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: connection
      image: {{ include "ecc2k130-coordinator.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - python
        - -c
        - |
          import json
          import urllib.request
          url = "http://{{ include "ecc2k130-coordinator.fullname" . }}-publisher:{{ .Values.publisher.service.port }}/healthz"
          with urllib.request.urlopen(url, timeout=10) as response:
              body = json.load(response)
          if body != {"ok": True}:
              raise SystemExit("publisher is not healthy: %r" % body)
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
  {{- /* Node-local routing only answers on nodes that run a publisher. */ -}}
  {{- if eq (include "ecc2k130-coordinator.publisherTrafficPolicy" .) "Local" }}
  {{- with (include "ecc2k130-coordinator.nodeSelector" (dict "root" . "component" "publisher")) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- with .Values.publisher.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.publisher.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
