[package]
# Same package name and dependency set as the frozen E-1 crate
# (../../koblitz-n83-index-design-20260929/packed_index_e1_canonical_20261009),
# so its Cargo.lock is reused byte for byte.
name = "n83-packed-index-e1"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "native_packed_index_liftscan"
path = "native_packed_index_liftscan.rs"

[dependencies]
crypto_lib = { package = "crypto", path = "../../koblitz-n83-index-design-20260929/packed_index_e1_canonical_20261009/crypto_source_snapshot" }
libc = "0.2"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
