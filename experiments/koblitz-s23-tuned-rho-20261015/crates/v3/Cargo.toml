[package]
name = "s23-tuned-rho-v3"
version = "0.1.0"
edition = "2021"
publish = false

# The index-calculus arm: crypto's `ic` binary at IC programme baseline v3
# (crypto 995ea207, the binary rule v3 measured), built from the snapshot that
# ../../restore_sources.py extracts. crypto 995ea207 has no Cargo.lock; this
# crate's lock is crypto 770f6a69's (via the reconcile experiment's r770 crate),
# pruned by Cargo to this crate's dependency set.
[[bin]]
name = "ic_v3"
path = "../../snapshots/v3/src/bin/ic.rs"

[dependencies]
crypto_lib = { package = "crypto", path = "../../snapshots/v3", default-features = false }
libc = "0.2"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
num-integer = "0.1"
rand = { version = "0.8", features = ["small_rng"] }
getrandom = "0.2"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
blake3 = "1.5"
flate2 = "1.0"
base64 = "0.21"
