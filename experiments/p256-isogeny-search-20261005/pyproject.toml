[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p256-isogeny-search"
version = "0.1.0"
description = "Reproducible structural search and ECDLP benchmarking for the NIST P-256 isogeny class"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "P-256 Isogeny Search contributors" }]
dependencies = ["sympy>=1.12,<2"]

[project.scripts]
p256-isogeny = "p256_isogeny_search.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
