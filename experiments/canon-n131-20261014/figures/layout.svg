<svg xmlns='http://www.w3.org/2000/svg' width='900' height='330' viewBox='0 0 900 330' font-family='DejaVu Sans, Helvetica, Arial, sans-serif'><rect width='100%' height='100%' fill='white'/><text x='450.0' y='22.0' font-size='14' text-anchor='middle' fill='#1f2328' font-weight='bold'>A 131-bit normal-basis word in [u64; 3] and the three exact arms</text><rect x='459.4' y='50' width='400.6' height='26' fill='#f6f8fa' stroke='#1f2328'/><text x='659.7' y='94.0' font-size='10' text-anchor='middle' fill='#59636e' font-weight='normal'>limb 0: bits 0-63</text><rect x='58.8' y='50' width='400.6' height='26' fill='#f6f8fa' stroke='#1f2328'/><text x='259.1' y='94.0' font-size='10' text-anchor='middle' fill='#59636e' font-weight='normal'>limb 1: bits 64-127</text><rect x='40.0' y='50' width='18.8' height='26' fill='#f6f8fa' stroke='#1f2328'/><text x='49.4' y='94.0' font-size='10' text-anchor='middle' fill='#59636e' font-weight='normal'>limb 2: 128-130</text><rect x='409.3' y='52' width='87.6' height='22' fill='#cfe3ff' stroke='#2f6db5'/><text x='453.1' y='44.0' font-size='10' text-anchor='middle' fill='#2f6db5' font-weight='normal'>longest zero run Z = 14, bits 58-71 (crosses the 63|64 limb edge)</text><text x='40.0' y='114.0' font-size='9' text-anchor='start' fill='#59636e' font-weight='normal'>bit 130 (most significant)</text><text x='860.0' y='114.0' font-size='9' text-anchor='end' fill='#59636e' font-weight='normal'>bit 0</text><text x='40.0' y='134.0' font-size='11' text-anchor='start' fill='#1f2328' font-weight='normal'>rotl(x, s) moves bit 130-s to the top; the least rotation starts at the top of a longest zero run: s = 130 - p (Lemma lem:zerogap)</text><text x='40.0' y='170.0' font-size='12' text-anchor='start' fill='#1f2328' font-weight='bold'>(a) exhaustive</text><text x='215.0' y='170.0' font-size='11' text-anchor='start' fill='#1f2328' font-weight='normal'>130 rotate-by-one steps, keep the first strict minimum</text><text x='215.0' y='185.0' font-size='10' text-anchor='start' fill='#59636e' font-weight='normal'>reference; ties take the least s</text><text x='40.0' y='212.0' font-size='12' text-anchor='start' fill='#1f2328' font-weight='bold'>(b) zero-gap scan</text><text x='215.0' y='212.0' font-size='11' text-anchor='start' fill='#1f2328' font-weight='normal'>ctz over every set bit (~65 per uniform word); rotate-and-compare at each gap >= running max</text><text x='215.0' y='227.0' font-size='10' text-anchor='start' fill='#59636e' font-weight='normal'>branchy; data-dependent trip counts</text><text x='40.0' y='254.0' font-size='12' text-anchor='start' fill='#1f2328' font-weight='bold'>(c) refine, branch-free</text><text x='215.0' y='254.0' font-size='11' text-anchor='start' fill='#1f2328' font-weight='normal'>candidate mask C; for t = 0..129: C' = C &amp; ~rotl(x,t); C = C' if C' != 0 (mask select)</text><text x='215.0' y='269.0' font-size='10' text-anchor='start' fill='#59636e' font-weight='normal'>fixed 130 steps; the first Z steps are the zero-gap filter</text><text x='40.0' y='296.0' font-size='12' text-anchor='start' fill='#1f2328' font-weight='bold'></text><text x='215.0' y='296.0' font-size='11' text-anchor='start' fill='#1f2328' font-weight='normal'>then s = 130 - msb(C) (per-limb lzcnt + select), word = 8-stage masked barrel rotation</text><text x='215.0' y='311.0' font-size='10' text-anchor='start' fill='#59636e' font-weight='normal'>one conditional jump: the loop counter</text></svg>
