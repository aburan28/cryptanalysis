[package]
name = "surface-evidence"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "surface-evidence"

[workspace]

[dependencies]
ecdlp-surfaces = { path = "../../../tools/ecdlp-surfaces" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[profile.release]
overflow-checks = true

[lints.clippy]
# Preserve the upstream portable SHA-256 source and its chunk types.
chunks_exact_to_as_chunks = "allow"
