# golangci-lint configuration for the cgo bindings.
#
# Schema: golangci-lint v1.x (the version .github/workflows/bindings.yml pins
# through golangci/golangci-lint-action@v6).
#
# The package is a single cgo package that compiles ../../src itself, so a few
# checks have to be relaxed where they misread cgo-generated code or where the
# Go types deliberately mirror the C ABI.  Every relaxation is justified below.

run:
  timeout: 5m
  # cgo must stay on: the package is nothing but a cgo wrapper, and with
  # CGO_ENABLED=0 every linter would collapse into "could not import C".
  tests: true

linters:
  # NB: copyloopvar is deliberately absent - it needs `go >= 1.22` in go.mod
  # and this module still declares `go 1.21` (the CI matrix floor).
  enable:
    - durationcheck
    - errname
    - errorlint
    - gocritic
    - gofmt
    - goimports
    - gosec
    - makezero
    - misspell
    - nilerr
    - nolintlint
    - predeclared
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace

linters-settings:
  govet:
    enable-all: true
    disable:
      # `Options`, `Stats`, `ICParams` and `ICStats` are field-for-field
      # mirrors of the C structs in ca_ffi.h / ca_indexcalc.h.  Reordering
      # their fields to save padding would destroy that correspondence (and
      # the conversion functions' readability) for a handful of bytes.
      - fieldalignment
      # `if _, err := f(); err != nil` inside a function that already has an
      # `err` is the normal Go idiom; the tests use it throughout.
      - shadow
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      # cgo's pseudo-package "C" is counted as a second import of the real
      # "unsafe" import, so every cgo file trips this.
      - dupImport
      # False positive on cgo call sites: gocritic inspects the rewritten
      # _Cfunc_* expansion and reports an identical LHS/RHS at a column past
      # the end of the original line (cgo.go, ca_ic_precompute).
      - dupSubExpr
      # Reports `// p = 2*order + 1` style explanatory comments next to
      # constants as commented-out code.
      - commentedOutCode
      # Naming the results of small two-value helpers adds noise here.
      - unnamedResult
  revive:
    rules:
      - name: exported
  nolintlint:
    require-explanation: true
    require-specific: true
    allow-unused: false

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Runnable godoc examples use the documented `if err != nil { log.Fatal }`
    # shape together with `defer x.Close()`; that is the idiom readers expect
    # even though log.Fatal would skip the deferred call.
    - path: example_test\.go
      linters:
        - gocritic
      text: "exitAfterDefer"
