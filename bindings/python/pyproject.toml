[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptanalysis"
version = "0.1.0"
description = "Python bindings for libcryptanalysis: BSGS, Pollard rho, kangaroo, grumpy giants, Pohlig-Hellman, Cheon and index calculus for discrete logarithms (p < 2^64)"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["cryptanalysis", "discrete-logarithm", "elliptic-curve", "pollard-rho", "bsgs", "index-calculus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security :: Cryptography",
    "Operating System :: POSIX",
]
dependencies = []

[tool.setuptools]
packages = ["cryptanalysis"]
include-package-data = true

[tool.setuptools.package-data]
cryptanalysis = ["libcryptanalysis*", "_cryptanalysis*"]
