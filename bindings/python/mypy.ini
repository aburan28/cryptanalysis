# mypy configuration for the ctypes bindings.
#
# Run from bindings/python:  mypy
[mypy]
files = cryptanalysis
# The oldest interpreter the package supports (requires-python = ">=3.8").
# mypy itself no longer accepts 3.8 as a target, so 3.9 is the floor we can
# type-check against; the runtime matrix in CI still covers 3.8.
python_version = 3.9

warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
# warn_return_any is off on purpose: every `lib.ca_*()` call goes through
# ctypes.CDLL, whose function pointers are typed as returning Any, so the rule
# would fire on every single wrapper that returns a C result.
warn_return_any = False
strict_equality = True
no_implicit_optional = True
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
extra_checks = True
