[workspace]
resolver = "2"
members = ["cryptanalysis-sys", "cryptanalysis", "cryptanalysis-cuda"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Verified floor: the committed Cargo.lock is lockfile v4, which Cargo only
# understands from 1.78 on.  cryptanalysis-cuda raises its own floor to 1.88.
rust-version = "1.78"
license = "MIT"
repository = "https://github.com/aburan28/cryptanalysis"
