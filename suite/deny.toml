# cargo-deny configuration for the attack suite.
# Run with:  cargo deny --manifest-path suite/Cargo.toml check
#
# Some sixty crates resolve here (clap, serde, rayon, num-bigint, blake3 and
# their trees), so the licence and source rules are strict and the
# duplicate-version rule is enforced; anything new has to be added consciously.

[graph]
# Only the targets we actually build and test in CI.  Without this, cargo-deny
# pulls Windows-only dependencies into the graph and reports duplicate versions
# that no CI job could ever link.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# The optional Redis backend of the algebra cache is not part of the checked
# graph: it is opt-in and pulls a TLS stack that CI never links.
all-features = false

[advisories]
version = 2
# Fail on anything RustSec knows about, including crates that have been
# yanked from crates.io.
yanked = "deny"
ignore = []

[licenses]
version = 2
# Exactly the licences present in the resolved graph today:
#   MIT / Apache-2.0        - almost everything (dual-licensed)
#   Unicode-3.0             - unicode-ident's data tables
#   BSD-2-Clause            - the zerocopy pair (one of its options)
#   BSD-3-Clause            - subtle
#   CC0-1.0                 - blake3 and constant_time_eq (one of their options)
#   Unlicense               - memchr (one of its options)
# A new dependency under any other licence has to be added here consciously.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
# The suite depends on the in-repository Rust bindings of the C library
# (bindings/rust, for `crax`'s generic solvers) by path with no version
# requirement, as the bindings' own members do; that is not the
# `version = "*"` sloppiness the wildcards check is aimed at.  Only applies
# to unpublished crates, which both are.
allow-wildcard-paths = true
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
